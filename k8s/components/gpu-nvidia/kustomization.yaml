# Профиль железа: видеокарта NVIDIA. Компонент, а не оверлей: его подключает тот оверлей, которому
# карта нужна, и ничего больше в дереве не меняется.
#
# Почему добавляем, а не убираем. Базы всех AI-модулей описаны под CPU, и это не случайность:
# kustomize-компоненты надёжно добавляют поля и плохо удаляют. Снять nvidia.com/gpu из базы можно было бы
# только патчем JSON6902 с путём
#   /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
# — с индексом контейнера и слешем, экранированным как ~1. Такая строка пишется один раз и ломается молча
# при любой правке порядка контейнеров. При CPU-базе она просто не нужна.
#
# Тег образа компонент НЕ трогает. Трансформер images в оверлее всё равно перебивает newTag компонента,
# а именно оверлей потом получает digest от джобы resolve-images — поэтому вариант образа (server или
# server-cuda) выбирается там же, в оверлее, одной строкой и на виду.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: gpu.yaml
