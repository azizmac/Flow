# Оркестратор CI: триггеры, порядок стадий и все джобы, видимые в интерфейсе.
#
# Почему всё в одном файле, а не в reusable workflow: вызов reusable-воркфлоу переименовывает вложенные джобы
# в составные («Тесты · Auth / run») и ломает читаемость списка запуска — а нам важно ровно обратное, видеть
# каждый модуль отдельной понятной строкой. Повторяющиеся шаги вынесены в composite actions (.github/actions/*):
# они не трогают имена джоб.
#
# Стадии: проверки → тесты → образ → выкатка. Kubernetes больше нет: self-hosted раннер стоит на том же
# сервере, где живёт Flow, и выкатка — это те же два стека docker compose, что и у разработчика,
# только .env собирается из Variables/Secrets репозитория. См. docs/TZ_cicd_host.md.

name: CI

run-name: CI · ${{ github.event_name == 'workflow_dispatch' && 'ручной запуск' || github.ref_name }} · @${{ github.actor }}

on:
  # Ветки без PR намеренно не гоняем: пуш в ветку с открытым PR иначе запускал бы CI дважды, причём
  # группы concurrency у push и pull_request разные — прогоны не отменяли бы друг друга, а шли парой.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Пропустить тесты (только для отладки самого пайплайна; публикация образов при этом выключается)
        type: boolean
        default: false
      pull_models:
        description: Скачать веса моделей в том flow-models-data на хосте (гигабайты, разово; не часть обычной выкатки)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # На main не отменяем: вытесненный посреди публикации прогон оставляет реестр в непонятном состоянии,
  # а на коммите — красный CI без внятной причины.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Минимум и ничего сверх: образы уезжают в Docker Hub по паре REGISTRY_USERNAME/REGISTRY_PASSWORD,
# то есть прав самого GITHUB_TOKEN пайплайну не нужно вовсе.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------- Стадия 0: проверки ----------

  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # На pull_request paths-filter не смотрит в git, а запрашивает список файлов через REST API —
    # без pull-requests: read получает 403 «Resource not accessible by integration» и роняет весь прогон.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      registry: ${{ steps.registry.outputs.registry }}
      prefix: ${{ steps.registry.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Фильтры строго по графу ProjectReference, а не «всё в src/»: Flow.Auth и Flow.Client ссылаются только
      # на Flow.Shared, поэтому правка Flow.Infrastructure их образов не касается и пересобирать их незачем.
      # Только для автоматических событий: на workflow_dispatch base не с чем сравнивать (нет
      # github.event.before), и действие молча переключается на «изменения последнего коммита», что при
      # поверхностном чекауте означает «всё дерево». Ручной запуск поэтому просто собирает всё.
      - name: Затронутые модули
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common: &common
              - 'global.json'
              - '.dockerignore'
              - '.github/actions/build-image/**'
              - '.github/workflows/ci.yml'
            # Flow.Auth и Flow.Auth.Contracts входят сюда, а не в отдельный фильтр: после перехода
            # на модульный монолит Auth — это Razor Class Library внутри хоста Flow.Api, и её правка
            # меняет ровно один образ — flow-api. Отдельный образ flow-auth больше не собирается.
            api:
              - *common
              - 'src/Flow.Api/**'
              - 'src/Flow.Application/**'
              - 'src/Flow.Auth/**'
              - 'src/Flow.Auth.Contracts/**'
              - 'src/Flow.Domain/**'
              - 'src/Flow.Infrastructure/**'
              - 'src/Flow.Shared/**'
              # Интерфейс с переходом на серверный рендер стал библиотекой компонентов внутри образа
              # flow-api: отдельного образа flow-client больше нет, и его правка меняет ровно этот образ.
              # editor/** сюда же — бандл CodeMirror собирается стадией editor в src/Flow.Api/Dockerfile.
              - 'src/Flow.Client/**'

      # Реестр — Docker Hub (REGISTRY=docker.io), владелец образов задаётся переменной IMAGE_PREFIX и с именем
      # владельца репозитория на GitHub не совпадает, поэтому дефолта здесь нет: лучше честно упасть с текстом,
      # чем молча собрать образ под чужим или несуществующим именем. Регистр приводим к нижнему — реестры
      # принимают только его, а функции lower() в выражениях GitHub нет.
      - name: Реестр и префикс образов
        id: registry
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
          PUBLISHING: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          registry="${REGISTRY:-docker.io}"
          prefix="${IMAGE_PREFIX:-}"

          # Падаем только там, где имя образа действительно нужно. На PR и в ветке образ никуда не уезжает,
          # поэтому отсутствие переменной там — не ошибка автора, а обычное дело для чужого форка.
          if [ -z "$prefix" ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error title=IMAGE_PREFIX::не задана переменная IMAGE_PREFIX — это владелец образов в реестре (например, not2ilya2work). Settings → Secrets and variables → Actions → Variables"
              exit 1
            fi
            prefix=local
            echo "::notice title=IMAGE_PREFIX::переменная не задана; образ соберётся под локальным именем, публикации в этом прогоне нет"
          fi

          prefix="$(echo "$prefix" | tr '[:upper:]' '[:lower:]')"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Итог в отчёт
        shell: bash
        run: |
          manual="${{ github.event_name == 'workflow_dispatch' && 'да (ручной запуск собирает всё)' || 'нет' }}"
          {
            echo "### Что изменилось"
            echo
            echo "| Модуль | Изменён | Будет собран |"
            echo "|--------|---------|--------------|"
            echo "| flow-api | ${{ steps.filter.outputs.api || '—' }} | ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }} |"
            echo
            echo "Ручной запуск: $manual · образы: \`${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.prefix }}/flow-*\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-actions:
    name: Проверка · workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ловит то, что иначе видно только после пуша: опечатки в контекстах, несуществующие поля, ошибки в
      # needs и matrix, а заодно shellcheck по каждому run-блоку.
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  lint-docker:
    name: Проверка · Dockerfile (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # Путь задаём явным include, а не вычисляем из имени модуля: цепочка тернарников в выражениях GitHub
      # читается хуже таблицы и молча даёт пустую строку при опечатке.
      matrix:
        include:
          - module: api
            dockerfile: src/Flow.Api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml

  lint-compose:
    name: Проверка · compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Оба стека проверяем отдельно: ошибка в любом ломает обещание «проект поднимается одной командой».
      # С профилем proxy: без него compose не разбирает сервис caddy вовсе, и ошибка в нём дожила бы до сервера.
      - name: Стек приложения
        run: docker compose -f docker-compose.yml --profile proxy config -q

      - name: Стек данных
        run: docker compose -f docker-compose.data.yml config -q

      # Оверлей профиля железа проверяется отдельно и вместе с базой: сам по себе он неполон
      # (в нём только переопределения), а ошибка в нём всплыла бы лишь у того, у кого есть карта.
      - name: docker-compose.data.yml + оверлей NVIDIA
        shell: bash
        run: docker compose -f docker-compose.data.yml -f docker/ai/nvidia.yml config -q

      # Класс ошибок «сервис читает ${VAR}, а нигде она не объявлена» — именно так когда-то потерялся AUTH_ISSUER.
      - name: Переменные compose объявлены
        run: sh scripts/check-compose-env.sh

  lint-editor:
    name: Проверка · бандл редактора
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Эта проверка пришла из .github/workflows/build.yml, который после переработки пайплайна больше
      # никто не вызывает: он остался reusable-воркфлоу без единого вызывающего. Оставить её там значило бы
      # тихо потерять гарантию — файл на месте, шаг написан, а не выполняется никогда.
      #
      # Что она стережёт: бандл CodeMirror лежит в репозитории, чтобы клиент запускался без Node, но
      # собирается из editor/flow-editor.src.js. Правка исходника без пересборки бандла не ломает ни сборку,
      # ни тесты — редактор просто продолжает работать по старому коду, и обнаруживается это в браузере.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Flow.Client/editor/package-lock.json

      - name: Бандл собран из текущего исходника
        working-directory: src/Flow.Client/editor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --stat --exit-code -- ../wwwroot/js/flow-editor.js

  lint-sdk:
    name: Проверка · версия SDK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ловит «зелёный dotnet build, красная сборка образа»: в global.json одна версия SDK, а в Dockerfile тег
      # базового образа живёт своей жизнью и меняется руками.
      - name: Теги SDK в Dockerfile совпадают с global.json
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -r '.sdk.version' global.json | cut -d. -f1-2)"
          status=0
          for file in src/Flow.Api/Dockerfile; do
            line="$(grep -n 'mcr.microsoft.com/dotnet/sdk:' "$file" | head -1)"
            number="${line%%:*}"
            tag="$(printf '%s' "$line" | sed -n 's|.*dotnet/sdk:\([0-9.]*\).*|\1|p')"
            if [ "$tag" != "$expected" ]; then
              echo "::error file=$file,line=$number,title=SDK::в Dockerfile образ sdk:$tag, а в global.json $expected"
              status=1
            fi
          done
          exit $status

  check-vars:
    name: Проверка · переменные
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Забытая переменная не роняет приложение: подставляется дев-дефолт из appsettings.json, и прод молча
      # уезжает с паролем flow. Поэтому проверяем состав переменных до того, как что-то соберётся.
      # Секреты проверяем только там, где они реально нужны и доступны: в pull request из форка GitHub их
      # не выдаёт вовсе, и красный крестик на чужом PR означал бы лишь то, что автор — не владелец репозитория.
      # На main проверяется этап 2 — всё, без чего выкатка на хост уедет с дев-паролями из compose.
      - name: Обязательные переменные заданы
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          AUTH_CERT_PASSWORD: ${{ secrets.AUTH_CERT_PASSWORD }}
          BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}
          PUBLISHING: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ "$PUBLISHING" = true ]; then
            sh scripts/check-vars.sh 2
          else
            sh scripts/check-vars.sh 1 --no-secrets
          fi

  # ---------- Стадия 1: сборка и тесты ----------

  build:
    name: Сборка .NET (Release)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Гейт для интерфейса: своего тестового проекта у него по-прежнему нет, и компиляция —
      # всё, что мы про него проверяем. Теперь он собирается вместе с решением, как обычная библиотека.
      - name: Сборка решения
        uses: ./.github/actions/dotnet-test
        with:
          title: Сборка решения

  test-unit:
    name: Тесты · unit (Domain + Application)
    needs: build
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flow.Domain.Tests
        uses: ./.github/actions/dotnet-test
        with:
          project: tests/Flow.Domain.Tests
          title: Domain

      - name: Flow.Application.Tests
        uses: ./.github/actions/dotnet-test
        with:
          project: tests/Flow.Application.Tests
          title: Application

  test-infra:
    name: Тесты · Infrastructure (pgvector + MinIO)
    needs: build
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Образ базы тянем заранее: он большой, а Testcontainers считает время его скачивания частью таймаута
      # запуска контейнера. Именно pgvector, а не postgres: миграция делает CREATE EXTENSION vector.
      - name: Предзагрузка образа БД
        run: docker pull pgvector/pgvector:pg16

      # Category!=Model — тесты, которым нужен живой llama-server; Category!=Golden — замер качества выдачи
      # на базе разработчика. И то, и другое в CI ничего не проверяет.
      - name: Flow.Infrastructure.Tests
        uses: ./.github/actions/dotnet-test
        with:
          project: tests/Flow.Infrastructure.Tests
          filter: Category!=Model&Category!=Golden
          title: Infrastructure

  test-auth:
    name: Тесты · Auth
    needs: build
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Предзагрузка образа БД
        run: docker pull pgvector/pgvector:pg16

      - name: Flow.Auth.Tests
        uses: ./.github/actions/dotnet-test
        with:
          project: tests/Flow.Auth.Tests
          title: Auth

  test-api:
    name: Тесты · Api
    needs: build
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Предзагрузка образа БД
        run: docker pull pgvector/pgvector:pg16

      - name: Flow.Api.Tests
        uses: ./.github/actions/dotnet-test
        with:
          project: tests/Flow.Api.Tests
          title: Api

  # ---------- Стадия 2: образ ----------
  #
  # Образ один — flow-api: Auth-модуль и интерфейс компилируются в него же, поэтому гейтом стоят тесты
  # всех модулей. Публикуем только с main и только не из pull_request: форк не должен уметь положить
  # образ в реестр.

  image-api:
    name: Образ · flow-api
    # test-auth здесь не для полноты: Auth-модуль компилируется внутрь этого образа, значит его
    # падение обязано останавливать публикацию ровно так же, как падение тестов Api.
    needs: [changes, check-vars, lint-sdk, lint-docker, build, test-unit, test-infra, test-api, test-auth]
    # Условие разбираем поимённо, а не через needs.*: при провале build тестовые джобы получают результат
    # skipped, и общая проверка «нет ни одного failure» пропустила бы сборку образа на несобирающемся коде.
    # skipped у тестов допустим только осознанно — при ручном запуске со skip_tests.
    if: >-
      always()
      && needs.changes.outputs.api == 'true'
      && needs.changes.result == 'success'
      && needs.check-vars.result == 'success'
      && needs.lint-sdk.result == 'success'
      && needs.lint-docker.result == 'success'
      && needs.build.result == 'success'
      && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped')
      && (needs.test-infra.result == 'success' || needs.test-infra.result == 'skipped')
      && (needs.test-api.result == 'success' || needs.test-api.result == 'skipped')
      && (needs.test-auth.result == 'success' || needs.test-auth.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Digest забирает выкатка: хост тянет образ по digest'у, а не по тегу latest — так на сервер едет
    # ровно то, что собрано и протестировано в этом прогоне, а не то, на что тег смотрит в момент pull.
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Сборка образа
        id: image
        uses: ./.github/actions/build-image
        with:
          module: api
          dockerfile: src/Flow.Api/Dockerfile
          registry: ${{ needs.changes.outputs.registry }}
          image: ${{ needs.changes.outputs.registry }}/${{ needs.changes.outputs.prefix }}/flow-api
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.skip_tests != true }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

  # ---------- Стадия 3: выкатка на хост (self-hosted раннер flow) ----------
  #
  # Раннер стоит на самом сервере Flow, поэтому выкатка — это docker compose в каталоге DEPLOY_DIR
  # (по умолчанию /opt/flow): туда копируются compose-файлы и docker/{ai,data}, туда же пишется .env
  # из Variables и Secrets. Рабочий каталог раннера для этого не годится: checkout чистит его перед
  # каждой джобой, а стек данных монтирует ./docker/ai/models.ini и складывает бэкапы в ./backups.
  #
  # Только push в main и ручной запуск с main. На PR и в ветках выкатки нет — там нет и образа в реестре.
  # Пропущенный образ (api не менялся) — норма: тогда на хосте остаётся прежний образ, а выкатка
  # применяет только изменившиеся настройки и compose-файлы.

  deploy:
    name: Выкатка · хост
    needs: [changes, lint-compose, check-vars, build, test-unit, test-infra, test-auth, test-api, image-api]
    # !cancelled() вместо дефолтного success(): пропуск image-api заразен и погасил бы выкатку
    # на каждом коммите, который не трогает код api. Результаты нужных джоб проверяются явно.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.result == 'success'
      && needs.lint-compose.result == 'success'
      && needs.check-vars.result == 'success'
      && needs.build.result == 'success'
      && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped')
      && (needs.test-infra.result == 'success' || needs.test-infra.result == 'skipped')
      && (needs.test-api.result == 'success' || needs.test-api.result == 'skipped')
      && (needs.test-auth.result == 'success' || needs.test-auth.result == 'skipped')
      && (needs.image-api.result == 'success' || needs.image-api.result == 'skipped')
    runs-on: [self-hosted, flow]
    timeout-minutes: 40
    # Хост один: две выкатки подряд ждут друг друга, а не идут наперегонки в одном каталоге.
    concurrency:
      group: deploy-host
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.AUTH_ISSUER }}
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/flow' }}
      AI_BACKEND: ${{ vars.AI_BACKEND || 'cpu' }}
      PROXY_ENABLED: ${{ vars.PROXY_ENABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Всё, что уезжает в .env, перечислено здесь один раз с префиксом FLOW_ENV_: скрипт берёт имена
      # по префиксу, второго списка, который разъехался бы с этим, нет. Пустое значение в .env не пишется —
      # тогда действует дефолт из compose. Значения берутся в одинарные кавычки: так их буквально читает
      # и compose (без подстановки $), и sh — а пароль с $ в двойных кавычках compose молча бы «раскрыл».
      - name: Каталог установки и .env
        id: env
        shell: bash
        env:
          NEW_IMAGE: ${{ needs.image-api.outputs.digest && format('{0}/{1}/flow-api@{2}', needs.changes.outputs.registry, needs.changes.outputs.prefix, needs.image-api.outputs.digest) || '' }}
          LATEST_IMAGE: ${{ needs.changes.outputs.registry }}/${{ needs.changes.outputs.prefix }}/flow-api:latest
          FLOW_ENV_API_PORT: ${{ vars.API_PORT }}
          FLOW_ENV_TZ: ${{ vars.TZ }}
          FLOW_ENV_AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          # За Caddy дефолты другие: api виден снаружи только через прокси (он верит X-Forwarded-* от кого угодно),
          # а OpenIddict больше не принимает http. Явно заданная переменная всё равно главнее.
          FLOW_ENV_PROXY_ENABLED: ${{ vars.PROXY_ENABLED }}
          FLOW_ENV_API_BIND: ${{ vars.API_BIND || (vars.PROXY_ENABLED == 'true' && '127.0.0.1' || '') }}
          FLOW_ENV_AUTH_ALLOW_INSECURE_HTTP: ${{ vars.AUTH_ALLOW_INSECURE_HTTP || (vars.PROXY_ENABLED == 'true' && 'false' || '') }}
          FLOW_ENV_CADDY_IMAGE: ${{ vars.CADDY_IMAGE }}
          FLOW_ENV_POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          FLOW_ENV_POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          FLOW_ENV_S3_BUCKET: ${{ vars.S3_BUCKET }}
          FLOW_ENV_BOOTSTRAP_ENABLED: ${{ vars.BOOTSTRAP_ENABLED }}
          FLOW_ENV_BOOTSTRAP_ID: ${{ vars.BOOTSTRAP_ID }}
          FLOW_ENV_BOOTSTRAP_EMAIL: ${{ vars.BOOTSTRAP_EMAIL }}
          FLOW_ENV_BOOTSTRAP_USERNAME: ${{ vars.BOOTSTRAP_USERNAME }}
          FLOW_ENV_BOOTSTRAP_FIRST_NAME: ${{ vars.BOOTSTRAP_FIRST_NAME }}
          FLOW_ENV_BOOTSTRAP_LAST_NAME: ${{ vars.BOOTSTRAP_LAST_NAME }}
          FLOW_ENV_SEARCH_ENABLED: ${{ vars.SEARCH_ENABLED }}
          FLOW_ENV_SEARCH_INDEXING_ENABLED: ${{ vars.SEARCH_INDEXING_ENABLED }}
          FLOW_ENV_EMBEDDINGS_ENABLED: ${{ vars.EMBEDDINGS_ENABLED }}
          FLOW_ENV_EMBEDDINGS_MODEL: ${{ vars.EMBEDDINGS_MODEL }}
          FLOW_ENV_RERANK_ENABLED: ${{ vars.RERANK_ENABLED }}
          FLOW_ENV_RERANKER_MODEL: ${{ vars.RERANKER_MODEL }}
          FLOW_ENV_VISION_ENABLED: ${{ vars.VISION_ENABLED }}
          FLOW_ENV_VISION_MODEL: ${{ vars.VISION_MODEL }}
          FLOW_ENV_VISION_MODEL_FILE: ${{ vars.VISION_MODEL_FILE }}
          FLOW_ENV_AI_THREADS: ${{ vars.AI_THREADS }}
          # На карте процессорные буферы 8192 не влезают в видеопамять (cudaMalloc out of memory на 4 ГБ),
          # поэтому при AI_BACKEND=cuda дефолт — измеренная тройка 2048/512/512, см. docker/ai/nvidia.yml.
          FLOW_ENV_AI_CTX_SIZE: ${{ vars.AI_CTX_SIZE || (vars.AI_BACKEND == 'cuda' && '2048' || '') }}
          FLOW_ENV_AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE || (vars.AI_BACKEND == 'cuda' && '512' || '') }}
          FLOW_ENV_AI_UBATCH_SIZE: ${{ vars.AI_UBATCH_SIZE || (vars.AI_BACKEND == 'cuda' && '512' || '') }}
          FLOW_ENV_AI_IMAGE: ${{ vars.AI_IMAGE }}
          FLOW_ENV_AI_IMAGE_CUDA: ${{ vars.AI_IMAGE_CUDA }}
          FLOW_ENV_BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          FLOW_ENV_BACKUP_CRON: ${{ vars.BACKUP_CRON }}
          FLOW_ENV_BACKUP_KEEP: ${{ vars.BACKUP_KEEP }}
          FLOW_ENV_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FLOW_ENV_MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          FLOW_ENV_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          FLOW_ENV_AUTH_CERT_PASSWORD: ${{ secrets.AUTH_CERT_PASSWORD }}
          FLOW_ENV_BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail

          # Caddy берёт домен прямо из AUTH_ISSUER. Порт или путь в нём, http или голый IP вместо имени —
          # и Caddy либо слушает не тот порт, либо выпускает самоподписанный сертификат; оба случая ловим
          # здесь, пока старый стек ещё работает.
          if [ "$PROXY_ENABLED" = true ]; then
            if ! [[ "${FLOW_ENV_AUTH_ISSUER:-}" =~ ^https://[A-Za-z0-9.-]+$ ]] \
              || [[ "$FLOW_ENV_AUTH_ISSUER" =~ ^https://[0-9.]+$ ]]; then
              echo "::error title=AUTH_ISSUER::при PROXY_ENABLED=true нужен https://домен без порта и пути, получено «${FLOW_ENV_AUTH_ISSUER:-}»"
              exit 1
            fi
          fi

          mkdir -p "$DEPLOY_DIR/docker"

          # Образ: новый digest этого прогона; если api не пересобирался — тот, что уже стоит на хосте;
          # на самой первой выкатке без сборки — latest из реестра.
          previous=
          if [ -f "$DEPLOY_DIR/.env" ]; then
            previous="$(sed -n "s/^FLOW_API_IMAGE='\(.*\)'$/\1/p" "$DEPLOY_DIR/.env" | tail -1)"
          fi
          image="${NEW_IMAGE:-${previous:-$LATEST_IMAGE}}"

          # Файлы копируются поверх, а не каталог целиком заменяется: cp перезаписывает файл в том же
          # inode, и bind-монтирование живого контейнера (models.ini у ai, скрипты у backup) видит новое
          # содержимое, а не удалённый файл. Хеши пресета и Caddyfile нужны, чтобы перезапустить ai и caddy
          # при их правке: оба читают конфиг только на старте.
          models_before="$(sha256sum "$DEPLOY_DIR/docker/ai/models.ini" 2>/dev/null | cut -d' ' -f1 || true)"
          caddy_before="$(sha256sum "$DEPLOY_DIR/docker/caddy/Caddyfile" 2>/dev/null | cut -d' ' -f1 || true)"
          cp docker-compose.yml docker-compose.data.yml "$DEPLOY_DIR/"
          cp -R docker/ai docker/data docker/caddy "$DEPLOY_DIR/docker/"
          models_after="$(sha256sum "$DEPLOY_DIR/docker/ai/models.ini" | cut -d' ' -f1)"
          caddy_after="$(sha256sum "$DEPLOY_DIR/docker/caddy/Caddyfile" | cut -d' ' -f1)"

          lines=
          for key in $(compgen -e | grep '^FLOW_ENV_' | sort); do
            value="$(printenv "$key")"
            [ -n "$value" ] || continue
            name="${key#FLOW_ENV_}"
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error title=.env::значение $name содержит одинарную кавычку или перевод строки — в .env его не записать без искажений"
              exit 1
            fi
            lines+="$name='$value'"$'\n'
          done
          lines+="FLOW_API_IMAGE='$image'"$'\n'

          tmp="$DEPLOY_DIR/.env.tmp"
          (umask 077; : > "$tmp")
          {
            echo "# Собран CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "# Руками не править — перезапишется следующей выкаткой. Менять в Settings → Secrets and variables."
            printf '%s' "$lines"
          } >> "$tmp"
          mv "$tmp" "$DEPLOY_DIR/.env"

          {
            echo "image=$image"
            echo "previous=$previous"
            echo "models_changed=$([ "$models_before" = "$models_after" ] && echo false || echo true)"
            echo "caddy_changed=$([ "$caddy_before" = "$caddy_after" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo ".env записан в $DEPLOY_DIR, образ api: $image"

      # Сеть flow-network и внешние тома данных. Идемпотентно; DATA_ROOT/MODELS_ROOT действуют только
      # при создании тома, существующие тома скрипт не трогает.
      - name: Сеть и тома
        shell: bash
        env:
          DATA_ROOT: ${{ vars.DATA_ROOT }}
          MODELS_ROOT: ${{ vars.MODELS_ROOT }}
        run: sh "$DEPLOY_DIR/docker/data/init-env.sh"

      - name: Веса моделей (вручную)
        if: github.event_name == 'workflow_dispatch' && inputs.pull_models
        shell: bash
        env:
          EMBEDDINGS_MODEL_FILE: ${{ vars.EMBEDDINGS_MODEL_FILE }}
          EMBEDDINGS_MODEL_URL: ${{ vars.EMBEDDINGS_MODEL_URL }}
          RERANKER_MODEL_FILE: ${{ vars.RERANKER_MODEL_FILE }}
          RERANKER_MODEL_URL: ${{ vars.RERANKER_MODEL_URL }}
          VISION_MODEL_FILE: ${{ vars.VISION_MODEL_FILE }}
          VISION_MODEL_URL: ${{ vars.VISION_MODEL_URL }}
          VISION_MMPROJ_FILE: ${{ vars.VISION_MMPROJ_FILE }}
          VISION_MMPROJ_URL: ${{ vars.VISION_MMPROJ_URL }}
          SET: ${{ vars.VISION_ENABLED == 'true' && 'all+vision' || 'all' }}
        run: sh "$DEPLOY_DIR/docker/data/pull-models.sh" "$SET"

      # Postgres и MinIO ждём по healthcheck, бакет создаёт s3-init синхронно — его провал роняет выкатку,
      # а не всплывает при первой загрузке файла. Бэкап и ИИ — профили: включаются переменными
      # BACKUP_ENABLED (по умолчанию да) и AI_ENABLED (по умолчанию нет: без весов llama-server не стартует).
      - name: Стек данных
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED || 'true' }}
          AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
          MODELS_CHANGED: ${{ steps.env.outputs.models_changed }}
        run: |
          set -euo pipefail
          files=(-f docker-compose.data.yml)
          case "$AI_BACKEND" in
            cpu) ;;
            cuda) files+=(-f docker/ai/nvidia.yml) ;;
            *) echo "::error title=AI_BACKEND::значение «$AI_BACKEND» не поддерживается, допустимы cpu и cuda"; exit 1 ;;
          esac
          dc() { docker compose "${files[@]}" "$@"; }

          dc up -d --wait --wait-timeout 300 postgres s3
          dc run --rm -T s3-init

          if [ "$BACKUP_ENABLED" = true ]; then
            dc --profile backup up -d backup
          else
            dc --profile backup rm -sf backup
          fi

          if [ "$AI_ENABLED" = true ]; then
            # Пресет llama-server читает только на старте, а смена содержимого bind-файла контейнер
            # не пересоздаёт — поэтому при правке models.ini перезапуск явный.
            recreate=
            [ "$MODELS_CHANGED" = true ] && recreate=--force-recreate
            dc --profile ai up -d $recreate ai
          else
            dc --profile ai rm -sf ai
          fi
          dc ps

      # Логин во временный DOCKER_CONFIG, а не в ~/.docker раннера: токен реестра не остаётся лежать
      # на сервере между прогонами. Pull-пара REGISTRY_PULL_* — read-only; без неё берётся пара публикации,
      # без обеих образ тянется анонимно (публичный репозиторий).
      - name: Образ api
        shell: bash
        env:
          IMAGE: ${{ steps.env.outputs.image }}
          REGISTRY: ${{ needs.changes.outputs.registry }}
          PULL_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME || secrets.REGISTRY_USERNAME }}
          PULL_PASSWORD: ${{ secrets.REGISTRY_PULL_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if [ -n "$PULL_USERNAME" ]; then
            printf '%s' "$PULL_PASSWORD" | docker login "$REGISTRY" -u "$PULL_USERNAME" --password-stdin
          fi
          docker pull "$IMAGE"

      # Миграции — отдельным запуском нового образа (`--migrate`, те же hosted-службы, что и при старте)
      # ДО замены контейнера: упали — выкатка останавливается, а старый api продолжает работать.
      - name: Миграции
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        timeout-minutes: 15
        run: docker compose -p flow -f docker-compose.yml run --rm -T --no-deps api --migrate

      - name: Приложение
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        # Профиль proxy передаётся и здесь: иначе --remove-orphans вправе счесть контейнер caddy сиротой.
        run: |
          profile=()
          [ "$PROXY_ENABLED" = true ] && profile=(--profile proxy)
          docker compose -p flow -f docker-compose.yml "${profile[@]}" up -d --no-build --remove-orphans api

      # Раннер на том же сервере, поэтому проба идёт прямо на опубликованный порт. Заодно сверяется,
      # что контейнер действительно пересоздан на ожидаемом образе, а не остался на старом.
      - name: Проверка готовности
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          IMAGE: ${{ steps.env.outputs.image }}
          PORT: ${{ vars.API_PORT || '8080' }}
          TIMEOUT: ${{ vars.DEPLOY_TIMEOUT || '300' }}
        run: |
          set -euo pipefail
          dc() { docker compose -p flow -f docker-compose.yml "$@"; }
          # Сравниваем id образов, а не строки: строку ссылки Docker вправе нормализовать.
          running="$(docker inspect --format '{{.Image}}' "$(dc ps -q api)")"
          expected="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          if [ "$running" != "$expected" ]; then
            echo "::error title=Выкатка::api запущен на образе $running, ожидался $IMAGE ($expected)"
            exit 1
          fi
          deadline=$(( $(date +%s) + TIMEOUT ))
          until curl -fsS -o /dev/null --max-time 5 "http://127.0.0.1:$PORT/health/ready"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              dc logs --tail=200 api || true
              echo "::error title=Выкатка::/health/ready не ответил 200 за ${TIMEOUT} с — логи api выше"
              exit 1
            fi
            sleep 5
          done
          echo "api готов: http://127.0.0.1:$PORT/health/ready"

      # Caddy — после готовности api, чтобы не отдавать 502 на время миграций и старта. Проверка https идёт
      # через сам Caddy (--resolve на 127.0.0.1), но её провал — предупреждение, а не красная выкатка:
      # первый сертификат зависит от DNS и проброса портов на роутере, которых CI не видит и не чинит,
      # а сам Flow к этому моменту уже исправен.
      - name: Прокси (Caddy)
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          CADDY_CHANGED: ${{ steps.env.outputs.caddy_changed }}
        run: |
          set -euo pipefail
          dc() { docker compose -p flow -f docker-compose.yml --profile proxy "$@"; }
          if [ "$PROXY_ENABLED" != true ]; then
            dc rm -sf caddy
            exit 0
          fi
          recreate=
          [ "$CADDY_CHANGED" = true ] && recreate=--force-recreate
          dc up -d --no-deps $recreate caddy

          host="${AUTH_ISSUER#https://}"
          deadline=$(( $(date +%s) + 120 ))
          until curl -fsS -o /dev/null --max-time 5 --resolve "$host:443:127.0.0.1" "https://$host/health/ready"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              dc logs --tail=100 caddy || true
              echo "::warning title=Caddy::$AUTH_ISSUER не ответил по https за 120 с. Чаще всего это DNS домена не на этот сервер или роутер не пробрасывает 80/443 — логи caddy выше"
              exit 0
            fi
            sleep 5
          done
          echo "https готов: $AUTH_ISSUER"

      # Образы по digest'у остаются без тега; удаляем только свои (метка source ставится metadata-action)
      # и только не используемые контейнером — чужие образы на сервере не трогаем.
      - name: Уборка старых образов
        if: success()
        shell: bash
        run: docker image prune -f --filter "label=org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" || true

      - name: Итог
        if: always()
        shell: bash
        env:
          IMAGE: ${{ steps.env.outputs.image }}
          PREVIOUS: ${{ steps.env.outputs.previous }}
        run: |
          {
            echo "### Выкатка на хост"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Каталог | \`$DEPLOY_DIR\` |"
            echo "| Образ api | \`${IMAGE:-—}\` |"
            echo "| Предыдущий | \`${PREVIOUS:-—}\` |"
            echo "| ИИ | \`$AI_BACKEND\` |"
            echo "| Прокси | \`$PROXY_ENABLED\` |"
            if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$IMAGE" ]; then
              echo
              echo "Откат вручную на сервере: в \`$DEPLOY_DIR/.env\` вернуть \`FLOW_API_IMAGE='$PREVIOUS'\`, затем"
              echo "\`docker compose -p flow -f docker-compose.yml up -d --no-build api\`. Миграции схемы назад не катятся."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- Агрегатор ----------

  ci-ok:
    name: CI
    needs:
      - changes
      - lint-actions
      - lint-docker
      - lint-compose
      - lint-editor
      - lint-sdk
      - check-vars
      - build
      - test-unit
      - test-infra
      - test-auth
      - test-api
      - image-api
      - deploy
    # Не always(): при отмене всего прогона ci-ok выполнился бы и честно посчитал cancelled провалом —
    # на коммите оставался бы красный крестик там, где человек просто нажал «Cancel».
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Единственная джоба, которую имеет смысл ставить required-проверкой в branch protection: имена всех
      # остальных меняются при любой правке пайплайна, а пропущенные по фильтру джобы сами по себе мерж не держат.
      # Здесь же — таблица «кто именно упал», иначе required-проверка превращается в красный крестик без причины.
      - name: Итог
        shell: bash
        # Результаты передаём через env, а не подстановкой в текст команды: подстановка ${{ }} внутри run
        # склеивается с shell-кодом, и любая кавычка в значении ломает скрипт.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="$NEEDS"
          {
            echo "### Итог CI"
            echo
            echo "| Джоба | Результат |"
            echo "|-------|-----------|"
            echo "$results" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          failed="$(echo "$results" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd', ' -)"
          if [ -n "$failed" ]; then
            echo "::error title=CI::упали или отменены джобы: $failed"
            exit 1
          fi
          echo "все джобы зелёные или осознанно пропущены"
