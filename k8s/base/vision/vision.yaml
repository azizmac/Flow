# Визуальные эмбеддинги картинок: скриншот находится по описанию того, что на нём изображено, без OCR.
# Источник — сервис embeddings-vl профиля ai из docker-compose.data.yml (здесь модуль называется vision,
# по контракту имён слоя).
#
# Почему vLLM, а не llama.cpp, на котором сделан соседний модуль ai. Записанный в проекте замер («вектор
# красного квадрата совпал с вектором синего») верен, но проверял он не то, что казалось: запрос уходил
# в vLLM-форме — messages с image_url, — а llama-server такое тело на эмбеддингах не разбирает вовсе
# и эмбеддит текстовый остаток. В собственном формате (content с prompt_string и multimodal_data плюс
# --mmproj) картинка через проектор проходит, и в upstream на это есть регрессионный тест.
#
# Настоящие причины остаться на vLLM три, и все проверяемые: OpenAI-совместимой схемы с image_url для
# эмбеддингов в llama.cpp нет (PR #18665 закрыт), отдельного конвертера Qwen3VL-Embedding тоже нет
# (модель конвертируется как обычная VL-генеративка), а документация обещает мультимодальность только
# для /chat/completions. Переезд возможен, но он стоит правок в HttpVisionEmbeddingGenerator, конвертации
# весов и перезамера качества — то есть это отдельная работа, а не смена тега.
#
# Костыль VLLM_WSL2_ENABLE_PIN_MEMORY=1 из compose сюда НЕ перенесён намеренно: он нужен только под Docker
# Desktop с WSL, где vLLM выключает pinned memory и v1-движок не стартует с «UVA is not available».
# На нормальном Linux-ядре ноды эта переменная просто отключила бы оптимизацию без всякой пользы.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-vision
  labels:
    app.kubernetes.io/name: vision
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  # Как и у реранкера: карта одна и неделима, maxSurge при RollingUpdate потребовал бы вторую.
  strategy:
    type: Recreate
  # Втрое больше, чем у соседей, и это не перестраховка: при первом старте vLLM тянет веса с HuggingFace
  # (порядка 4 ГБ) прямо в поде, и только потом грузит модель. Верхняя граница со стороны кластера должна
  # быть заведомо больше бюджета startupProbe (ниже он 20 минут), иначе Deployment объявит выкатку
  # провалившейся раньше, чем под успеет стать готовым.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: vision
      app.kubernetes.io/part-of: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vision
        app.kubernetes.io/part-of: flow
        app.kubernetes.io/component: ai
    spec:
      imagePullSecrets:
        # Здесь regcred полезен по-настоящему, в отличие от соседних модулей: vllm/vllm-openai лежит
        # в Docker Hub, а анонимные pull'ы там ограничены по IP. Образ измеряется единицами гигабайт,
        # и упереться в лимит на середине закачки — обычное дело для домашнего адреса.
        - name: regcred
      nodeSelector:
        kubernetes.io/hostname: "${GPU_NODE}"
      # Тот же разбор, что у реранкера: строка обязательна, если containerd не сделан nvidia-рантаймом
      # по умолчанию, безвредна, если сделан, и смертельна, если RuntimeClass nvidia в кластере не создан
      # вовсе (под отклонит admission). Проверка — kubectl get runtimeclass, до первой выкатки.
      runtimeClassName: nvidia
      containers:
        - name: vision
          # Тег зафиксирован, и это требование, а не стиль. В compose дефолт — vllm/vllm-openai:latest,
          # то есть «то, что опубликовали сегодня»: два деплоя подряд могут приехать с разными версиями
          # движка, а откат становится невозможен в принципе — возвращать некуда, latest уже другой.
          # Для кластера это неприемлемо вдвойне: vLLM меняет поддержку архитектур моделей между минорными
          # версиями, и модель, которая работала вчера, завтра может просто не загрузиться.
          # В релиз всё равно уедет digest (resolve-images), но тег в базе обязан называть версию:
          # если кто-то применит base мимо рендера, он получит известную версию, а не сюрприз.
          image: vllm/vllm-openai:v0.10.1
          imagePullPolicy: IfNotPresent
          # args, а не command: ENTRYPOINT образа запускает api_server, и его надо сохранить.
          # --runner pooling — режим эмбеддингов, а не генерации.
          args:
            - --model
            - $(VISION_MODEL_REPO)
            - --served-model-name
            - $(VISION_MODEL)
            - --runner
            - pooling
            # --trust-remote-code исполняет код из репозитория модели. Для Qwen3-VL-Embedding это
            # обязательное условие запуска, но флаг стоит называть своим именем: доверие здесь выдаётся
            # конкретному репозиторию из VISION_MODEL_REPO, а не HuggingFace вообще. Из этого следует
            # практическое правило: ссылку на модель меняют так же осознанно, как версию образа.
            - --trust-remote-code
            - --max-model-len
            - $(VISION_MAX_LEN)
            - --gpu-memory-utilization
            - $(VISION_GPU_FRACTION)
            - --host
            - 0.0.0.0
            - --port
            - "8083"
          env:
            # HF_HOME уводит кэш HuggingFace в общий том моделей. Без этого vLLM качал бы веса в домашний
            # каталог внутри контейнера, то есть заново при каждом пересоздании пода — четыре гигабайта
            # на каждую выкатку.
            - name: HF_HOME
              value: /models/hf
            - name: VISION_MODEL_REPO
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: VISION_MODEL_REPO
            # VISION_MODEL — это --served-model-name, и он же Search__Embeddings__Vision__Model у Flow.Api.
            # Значения обязаны совпасть, поэтому оба берутся из одного ключа одного ConfigMap: разойдясь,
            # они дадут 404 от vLLM на каждый запрос при формально живом сервисе.
            - name: VISION_MODEL
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: VISION_MODEL
            - name: VISION_MAX_LEN
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: VISION_MAX_LEN
            # Доля VRAM. Критичная величина: time-slicing на одной карте решает планирование, но НЕ
            # изолирует память, поэтому сумма долей реранкера и vLLM обязана физически влезать в карту.
            - name: VISION_GPU_FRACTION
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: VISION_GPU_FRACTION
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          # В compose проверка здоровья была написана через python3 -c urllib.request: у образа vLLM нет
          # curl. В Kubernetes запрос делает kubelet снаружи контейнера, поэтому вся эта конструкция
          # исчезает — httpGet не зависит от того, что установлено внутри образа.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            # 120 попыток по 10 с = 20 минут. В compose стояло start_period 300s, но там веса уже лежали
            # в кэше: первый старт в чистом кластере — это ещё и закачка ~4 ГБ с HuggingFace по домашнему
            # каналу. Занижать бюджет тут вредно вдвойне: пока startupProbe не прошла, liveness выключена,
            # а при её провале под уходит в перезапуск и начинает закачку сначала — классическая петля,
            # в которой модель не успевает скачаться никогда.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            # Таймаут больше, чем у соседей: событийный цикл vLLM во время прогона батча отвечает не
            # мгновенно, и пятисекундный порог давал бы ложные срабатывания под нагрузкой.
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            # Самый прожорливый модуль стека по обычной памяти, и это неочевидно: веса лежат в VRAM, но
            # хосту нужны Python, torch, CUDA-контекст и распаковка скачанных шардов. Запрос 4Gi —
            # это то, без чего под просто не поедет; потолок 12Gi включает в себя и tmpfs под /dev/shm
            # (см. ниже): память emptyDir с medium: Memory считается памятью контейнера, и не учесть её
            # в лимите значит получить OOMKill ровно в тот момент, когда движок разогревается.
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: 1
          securityContext:
            # Без runAsNonRoot, и здесь для этого есть вторая причина сверх общей (у образа нет
            # проверенного USER): vLLM пишет в том — качает веса в /models/hf. Каталоги в томе создаёт
            # Job закачки от root, и под с подобранным наугад UID упёрся бы в отказ на записи уже после
            # старта — то есть после десятка минут ожидания.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # На запись — в отличие от эмбеддера и реранкера: vLLM тянет веса сам, токен HuggingFace для
            # Qwen3-VL-Embedding не нужен (репозиторий открытый), поэтому Job закачки эту модель не трогает.
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: flow-models
        # /dev/shm по умолчанию в Kubernetes — 64 МиБ, и это не настраивается иначе как вот таким томом.
        # vLLM держит движок отдельным процессом и общается с ним через разделяемую память; 64 МиБ ему
        # мало, а симптом нехватки выглядит как «Bus error» или зависание на инициализации — на модель
        # или на карту не похоже совсем.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
# Имя Service — flow-vision, хотя в compose сервис называется embeddings-vl. Значит VISION_ENDPOINT —
# http://flow-vision.flow-ai.svc.cluster.local:8083/v1, и именно так он теперь записан в §7.1 ТЗ и в
# deploy/required-vars.txt (раньше там стояло compose-имя embeddings-vl — расхождение устранено).
apiVersion: v1
kind: Service
metadata:
  name: flow-vision
  labels:
    app.kubernetes.io/name: vision
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vision
    app.kubernetes.io/part-of: flow
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
