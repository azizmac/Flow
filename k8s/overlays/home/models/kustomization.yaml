# Оверлей домашнего кластера, модуль закачки весов. Рендерится в manifests/models.yaml и применяется
# ТОЛЬКО вручную: workflow_dispatch с pull_models=true. В общий прогон выкатки этот оверлей не входит —
# по той же логике, что и слой хранилища.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow-ai

resources:
  - ../../../base/models

# Alpine тоже резолвится в digest наравне с остальными восемью образами. Может показаться избыточным —
# это же всего лишь busybox с wget, — но именно этот контейнер имеет право писать в том с весами, и
# подменённый апстримом «alpine:3.21» здесь стоит дороже, чем подменённый образ любого сервиса.
images:
  - name: alpine
    newTag: "3.21"
