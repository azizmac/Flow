# Оверлей домашнего кластера, модуль postgres. Рендерится в manifests/postgres.yaml.
#
# Оверлей отвечает ровно за две вещи, которые нельзя знать в base: в каком namespace живёт модуль и какой
# образ считать релизным. Всё остальное, что зависит от кластера, приезжает либо плейсхолдером
# (${WORKER_NODE} в nodeSelector, ${RELEASE_SHA} в имени Job — их подставляет envsubst до сборки), либо из
# ConfigMap flow-config и Secret flow-secrets, которые создаёт в кластере джоба deploy-platform.
#
# Почему namespace задаётся здесь, а не в base. Это единственное место, где имя namespace вообще
# упоминается: второй контур поднимается копией оверлея с другим значением, и ни один файл в base править
# не приходится. В самих объектах namespace не записан намеренно — иначе трансформер и явное поле
# соревновались бы за одно значение.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow-data

resources:
  - ../../../base/postgres

# Джоба рендера заменяет тег на digest (`kustomize edit set image pgvector/pgvector@sha256:...`), и
# правка приземляется именно в эту секцию. Она объявлена заранее и с осмысленным тегом, чтобы
# `kubectl kustomize k8s/overlays/home/postgres` руками собирал рабочий манифест, а не заготовку, —
# и чтобы `kustomize edit` не дописывал секцию в файл, стирая по дороге эти комментарии.
#
# Одна запись покрывает два объекта: StatefulSet и Job создания базы используют один и тот же образ.
# Это не совпадение, а решение — клиент psql обязан совпадать по мажорной версии с сервером.
#
# Тег в релизе не остаётся: в манифест едет digest. Подвижный тег означал бы, что `kubectl apply` не
# увидит изменений при обновлении апстрима и rollout не произойдёт вовсе.
images:
  - name: pgvector/pgvector
    newTag: pg16
