# Flow.Client — Blazor WebAssembly, отданный официальным nginx. Внутри контейнера ничего не исполняется,
# кроме раздачи статики: всё приложение работает в браузере.
#
# Отсюда — главная особенность модуля. Браузер читает адреса Flow.Api и Flow.Auth из файла
# wwwroot/appsettings.json, а файл этот пишется при старте контейнера скриптом
# docker/client/entrypoint.sh, положенным в /docker-entrypoint.d/40-flow-appsettings.sh. Скрипт читает ровно
# два имени — API_BASE_URL и AUTH_BASE_URL — и подставляет их в JSON.
#
# ПОЧЕМУ У ЭТОГО ПОДА НЕТ НИ ОДНОЙ НАСТРОЙКИ БЕЗОПАСНОСТИ, И ЭТО НЕ ЗАБЫВЧИВОСТЬ.
# Механизм /docker-entrypoint.d принадлежит официальному образу nginx, и его собственный entrypoint
# выполняет лежащие там скрипты только от root: при непривилегированном пользователе он их МОЛЧА пропускает
# (в логе одна строка о пропуске, ошибки нет, контейнер стартует, nginx отдаёт страницы). Результат —
# appsettings.json остаётся тем, что приехал из publish, клиент уходит на localhost:5000, и выглядит это как
# «вход не работает», а не как ошибка конфигурации. Поэтому здесь:
#   - нет runAsNonRoot и вообще нет securityContext: сброс capabilities сломал бы ещё и штатный переход
#     рабочих процессов nginx на пользователя nginx (это setuid, ему нужны capabilities);
#   - нет readOnlyRootFilesystem: скрипт ПИШЕТ /usr/share/nginx/html/appsettings.json, а сам nginx — свои
#     временные файлы в /var/cache/nginx;
#   - нет command и args: подмена команды выбрасывает entrypoint образа вместе со всем каталогом
#     /docker-entrypoint.d, то есть ровно с тем же тихим результатом.
# Проверка, что механизм отработал, делается снаружи: kubectl exec в под и cat appsettings.json — отдельный
# шаг джобы deploy-client. Это единственный способ увидеть провал подстановки.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-client
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: flow
spec:
  replicas: 1
  # Здесь, в отличие от api и auth, стратегия по умолчанию (RollingUpdate) — и это осмысленный выбор,
  # а не недосмотр: клиент не ходит в БД, не мигрирует схему и не держит томов, поэтому одновременное
  # существование старого и нового пода ничему не вредит и даёт выкатку без секунды простоя.
  strategy:
    type: RollingUpdate
  # Дедлайн меньше, чем у api и auth, и намеренно: nginx со статикой поднимается за секунды, ждать ему
  # нечего. Если за пять минут под не стал Ready — это не «долгий старт», а не скачавшийся образ или
  # проблема с планированием, и узнать об этом лучше раньше.
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: client
      app.kubernetes.io/part-of: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/part-of: flow
    spec:
      imagePullSecrets:
        - name: regcred
      automountServiceAccountToken: false
      containers:
        - name: client
          # Заглушка, digest подставляет джоба render — см. комментарий в k8s/base/auth/deployment.yaml.
          image: flow-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Ровно две переменные, и обе обязаны быть ВНЕШНИМИ адресами: их подставляют в файл, который
          # читает браузер, а не серверный код. Внутрикластерный FQDN здесь означал бы, что клиент в браузере
          # пользователя пытается открыть flow-api.flow.svc.cluster.local — имя, которого в домашней сети
          # не существует.
          # Значения приходят подстановкой envsubst на рендере, а не из ConfigMap, по той же причине, что и
          # в api с auth: правка ConfigMap не перезапускает под, а entrypoint пишет appsettings.json ровно
          # один раз — при старте. То есть из ConfigMap новое значение доехало бы до браузера только после
          # ручного рестарта, и «переменную поменял, а ничего не изменилось» стало бы штатным сюрпризом.
          # Имена переменных менять нельзя: их читает docker/client/entrypoint.sh, другие имена он
          # проигнорирует и подставит свои дефолты (localhost:8080 и localhost:5100) без единой ошибки.
          env:
            - name: API_BASE_URL
              value: "${PUBLIC_API_URL}"
            - name: AUTH_BASE_URL
              value: "${PUBLIC_API_URL}"  # вход живёт на адресе backend'а: Auth — модуль внутри него
          # Проб две, а не три: своего /health у статики нет, и придумывать его незачем — GET / отдаёт
          # index.html и доказывает ровно то, что нужно знать о nginx. startupProbe не нужен: подставить
          # два адреса в файл и подняться nginx успевает за доли секунды, а стартовый бюджет тут пришлось бы
          # выдумывать.
          # Оговорка: успешный GET / НЕ доказывает, что подстановка адресов сработала — index.html отдаётся
          # и с дефолтным appsettings.json. Это проверяет отдельный шаг с kubectl exec, см. шапку файла.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Запросы демонстративно маленькие, и это честно: nginx, отдающий .wasm и .gz из publish,
            # в покое занимает единицы мегабайт, а работа за него сделана на этапе сборки. Лимит нужен не
            # ради экономии, а чтобы под не смог утянуть ноду за собой: на двухнодовом кластере рядом живут
            # Postgres и MinIO, и выселение по памяти стоит дороже всего.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
