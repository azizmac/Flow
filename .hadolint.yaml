# Конфиг hadolint для двух Dockerfile: src/Flow.Api и src/Flow.Client. Третьего (src/Flow.Auth) больше
# нет — после перехода на модульный монолит Auth стал библиотекой внутри хоста Flow.Api.
# Джоба «Проверка · Dockerfile» гоняет линтер матрицей по файлам, а конфиг у обоих общий — поэтому
# каждое исключение здесь выключает правило сразу везде и каждое приходится объяснять.
#
# Порог падения намеренно не задан: по умолчанию hadolint валится начиная с уровня info, и это то,
# что нужно. Info-правила здесь не про стиль, а про вещи, которые ломают именно сборку образа.

ignored:
  # DL3066 «Non-numeric user-id may not be resolvable by host system» срабатывает на `USER $APP_UID`:
  # значений ARG и ENV базового образа hadolint не видит и любое имя переменной считает нечисловым,
  # хотя APP_UID объявлен в mcr.microsoft.com/dotnet/aspnet и содержит числовой UID.
  #
  # СЕЙЧАС ЭТО ИСКЛЮЧЕНИЕ СПИТ. Инструкции USER не осталось ни в одном из двух файлов: из
  # src/Flow.Api/Dockerfile её убрали вместе с модульным монолитом, потому что Auth-модуль пишет
  # сертификаты (/certs) и ключи Data Protection (/keys) в тома, чьи каталоги создаются от root.
  # Проверено прогоном hadolint по обоим файлам ВООБЩЕ БЕЗ конфига: находок ноль.
  #
  # Оставлено осознанно, а не по инерции: возврат к non-root в шапке того же Dockerfile записан как
  # намерение («при переходе на non-root нужен chown этих каталогов»), и в день, когда `USER $APP_UID`
  # вернётся, правило снова начнёт валить исправный файл. Строка дешевле, чем разбирательство.
  - DL3066

# DL3002 «Last USER should not be root» в списке намеренно отсутствует, хотя теперь оба образа
# действительно работают от root. Правило смотрит только на инструкции USER в самом Dockerfile и о
# пользователе базового образа ничего не знает — там, где USER нет вовсе, срабатывать нечему.
# Проверено прогоном hadolint 2.15+ по обоим файлам: находок нет.
#
# Глушить его «на всякий случай» вредно вдвойне: исключение общее для обоих файлов, и явный `USER root`,
# если он когда-нибудь появится, прошёл бы молча. Если правило всё же понадобится погасить точечно,
# для этого есть прагма в самом файле, строкой выше нужной инструкции:
#   # hadolint ignore=DL3002
