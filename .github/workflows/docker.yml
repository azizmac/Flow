# Джоба: сборка Docker-образа (Flow.Api или Flow.Auth — по input dockerfile); при push=true — публикация в registry.
# Ожидает (через secrets: inherit) секреты REGISTRY_USERNAME / REGISTRY_PASSWORD
# и переменные REGISTRY / IMAGE_NAME (передаются оркестратором через input image).
name: Docker image

on:
  workflow_call:
    inputs:
      push:
        description: Публиковать образ в registry
        type: boolean
        default: false
      image:
        description: Полное имя образа, например docker.io/user/flow-api
        type: string
        default: flow-api
      dockerfile:
        description: Dockerfile для сборки (src/Flow.Api|Flow.Auth|Flow.Client/Dockerfile)
        type: string
        default: src/Flow.Api/Dockerfile

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # docker.io требует namespace (user/flow-auth). Если AUTH_IMAGE_NAME / CLIENT_IMAGE_NAME не заданы,
      # оркестратор передаёт голое имя (docker.io/flow-auth) — namespace берём из IMAGE_NAME (user/flow-api → user).
      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          name="$IMAGE"
          if [ -n "$REGISTRY" ] && [ "${IMAGE_NAME#*/}" != "$IMAGE_NAME" ]; then
            path="${name#"$REGISTRY"/}"
            case "$path" in
              */*) ;;
              *) name="$REGISTRY/${IMAGE_NAME%/*}/$path" ;;
            esac
          fi
          echo "Image: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build${{ inputs.push && ' & push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
