# Flow.Client (Blazor WebAssembly): SPA-fallback на index.html, отдача заранее сжатых .gz из publish.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types application/wasm application/octet-stream application/json text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы фреймворка с fingerprint в имени можно кэшировать надолго; index.html и appsettings — нет.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }
}
