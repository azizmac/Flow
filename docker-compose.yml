# Стек приложения: api (ядро + Auth-модуль) и client. Данные (PostgreSQL и S3) живут в отдельном стеке —
# docker-compose.data.yml, проект flow-data. Здесь нет ни одного тома с данными проекта, поэтому
# `docker compose down -v` безопасен: он уносит только ключи и сертификаты Auth-модуля, которые
# пересоздаются при следующем старте. См. docs/TZ_infra_data_split.md, docs/TZ_modular_monolith.md.
#
#   sh docker/data/init-env.sh                       # один раз: общая сеть и тома данных
#   docker compose -f docker-compose.data.yml up -d  # данные
#   docker compose up -d --build                     # приложение
#
# Адреса БД и S3 — переменные: POSTGRES_HOST и S3_ENDPOINT можно увести на внешние сервисы
# и не поднимать docker-compose.data.yml вовсе.

# Базовый пользователь (Owner) при первом запуске: Auth-модуль создаёт учётную запись, Flow.Api — профиль
# с тем же Id. См. docs/TZ_modular_monolith.md. Пароль после первого входа нужно сменить.
x-bootstrap: &bootstrap
  Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-true}
  Bootstrap__Id: ${BOOTSTRAP_ID:-11111111-1111-1111-1111-111111111111}
  Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
  Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@flow.com}
  Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-admin}
  Bootstrap__FirstName: ${BOOTSTRAP_FIRST_NAME:-Admin}
  Bootstrap__LastName: ${BOOTSTRAP_LAST_NAME:-Flow}

services:
  api:
    build:
      context: .
      dockerfile: src/Flow.Api/Dockerfile
    restart: unless-stopped
    # depends_on на postgres нет: база в другом проекте Compose, ждать её healthcheck отсюда нельзя.
    # Сервис сам дожидается БД при старте (Startup:DatabaseWaitTimeoutSeconds), иначе перезапускается.
    environment:
      <<: *bootstrap
      # Внешний issuer токенов и OIDC discovery — адрес backend'а, который видит браузер.
      # Api валидирует токены локально через OpenIddict и внутренний URL для discovery/JWKS не использует.
      Auth__Issuer: ${AUTH_ISSUER:-http://localhost:8080}
      Auth__Client__RedirectUris__0: http://localhost:${CLIENT_PORT:-5016}/authentication/login-callback
      Auth__Client__PostLogoutRedirectUris__0: http://localhost:${CLIENT_PORT:-5016}/authentication/logout-callback
      # Локальный compose ходит по http; за TLS-терминатором оставить false.
      Auth__AllowInsecureHttp: ${AUTH_ALLOW_INSECURE_HTTP:-true}
      # PFX создаются сервисом сами при первом старте (Security/SelfSignedCertificates) в volume auth-certs;
      # свои сертификаты можно положить туда же или примонтировать вместо volume.
      Auth__SigningCertificate__Path: /certs/signing.pfx
      Auth__SigningCertificate__Password: ${AUTH_CERT_PASSWORD:-flow-certs}
      Auth__EncryptionCertificate__Path: /certs/encryption.pfx
      Auth__EncryptionCertificate__Password: ${AUTH_CERT_PASSWORD:-flow-certs}
      DataProtection__KeysPath: /keys
      Cors__Origins__0: http://localhost:${CLIENT_PORT:-5016}
      ConnectionStrings__Postgres: >-
        Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_INTERNAL_PORT:-5432};Database=${POSTGRES_DB:-flow};Username=${POSTGRES_USER:-flow};Password=${POSTGRES_PASSWORD:-flow}
      S3__Endpoint: ${S3_ENDPOINT:-http://s3:9000}
      S3__AccessKey: ${MINIO_ROOT_USER:-flow}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3__Bucket: ${S3_BUCKET:-flow}
      S3__UseSsl: ${S3_USE_SSL:-false}
      # Поиск включён по умолчанию: без модели он деградирует в полнотекстовый (GET /search
      # отвечает degraded: true), а очередь индексации копится до её появления. SEARCH_ENABLED=false
      # отключает и эндпоинты, и воркер — поведение приложения становится в точности прежним.
      Search__Enabled: ${SEARCH_ENABLED:-true}
      Search__Indexing__Enabled: ${SEARCH_INDEXING_ENABLED:-true}
      # Умный поиск: EMBEDDINGS_ENABLED=false — ни одной модели, поиск идёт только по словам,
      # а индексация продолжает работать и пишет чанки без векторов. Заодно гаснут визуальная
      # половина и реранкер: держать GPU-сайдкары ради выключенного поиска смысла нет.
      Search__Embeddings__Enabled: ${EMBEDDINGS_ENABLED:-true}
      Search__Embeddings__QueryEndpoint: ${EMBEDDINGS_QUERY_ENDPOINT:-http://ai:8081/v1}
      Search__Embeddings__IndexingEndpoint: ${EMBEDDINGS_INDEXING_ENDPOINT:-}
      Search__Embeddings__Model: ${EMBEDDINGS_MODEL:-Qwen3-Embedding-0.6B}
      # Вторая ступень выключена по умолчанию: она превращает поиск из мгновенного в секундный,
      # и это решение продукта. RERANK_ENABLED=true включает кнопку «Точнее» в интерфейсе.
      # Адрес тот же, что у эмбеддера, и это не опечатка: обе текстовые модели держит один сервис ai,
      # а различает он их по полю "model" в запросе — оно берётся из Search__Rerank__Model.
      Search__Rerank__Enabled: ${RERANK_ENABLED:-false}
      Search__Rerank__Endpoint: ${RERANK_ENDPOINT:-http://ai:8081/v1}
      Search__Rerank__Model: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      # Визуальная половина: тоже выключена по умолчанию и тоже требует GPU.
      Search__Embeddings__Vision__Enabled: ${VISION_ENABLED:-false}
      Search__Embeddings__Vision__Endpoint: ${VISION_ENDPOINT:-http://embeddings-vl:8083/v1}
      Search__Embeddings__Vision__Model: ${VISION_MODEL:-Qwen3-VL-Embedding-2B}
    volumes:
      - auth-certs:/certs
      - auth-keys:/keys
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - flow-network

  client:
    build:
      context: .
      dockerfile: src/Flow.Client/Dockerfile
    restart: unless-stopped
    # Клиент — Blazor WASM под nginx: Rider не должен его трансформировать (WASM отлаживается в браузере).
    # Без лейблов Rider подменяет entrypoint на .NET-дебаггер (рестарт-луп) или на Blazor dev server (нет SDK).
    labels:
      com.jetbrains.rider.debug: "false"
      com.jetbrains.rider.fast.mode: "false"
    depends_on:
      api:
        condition: service_started
    environment:
      # Адреса, которые видит браузер: порты наружу из этого же файла. Auth теперь часть Api.
      API_BASE_URL: http://localhost:${API_PORT:-8080}
      AUTH_BASE_URL: ${AUTH_ISSUER:-http://localhost:8080}
    ports:
      - "${CLIENT_PORT:-5016}:80"
    networks:
      - flow-network

networks:
  # Та же сеть, что у стека данных; создаётся docker/data/init-env.sh.
  flow-network:
    name: flow-network
    external: true

volumes:
  # Не данные проекта, а ключи подписи и cookie Auth-модуля: при потере пересоздаются, пользователи
  # просто входят заново. Поэтому тома обычные и `down -v` их уносит.
  auth-keys:
  auth-certs:
