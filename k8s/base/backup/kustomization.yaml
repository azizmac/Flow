# Слой бэкапов: один CronJob и ConfigMap со скриптом, который он запускает.
#
# Почему backup.sh лежит здесь копией, а не берётся из docker/data. Очень хотелось написать
# "files: backup.sh=../../../docker/data/backup.sh" и иметь один файл на два стека, но kustomize этого не
# разрешает: при дефолтном LoadRestrictionsRootOnly генератор не читает файлы выше каталога своей
# kustomization и падает с "security; file ... is not in or below ...". Обойти можно только флагом
# --load-restrictor LoadRestrictionsNone у каждой сборки — то есть у джоб рендера и lint-manifests тоже, и
# тогда единственный модуль во всём репозитории требовал бы особого флага, а забытый флаг ронял бы сборку
# всех оверлеев разом. Цена выбранного варианта — риск расхождения двух файлов, и он снимается одной
# проверкой, которую стоит держать в голове при правке любого из них:
#
#   diff docker/data/backup.sh k8s/base/backup/backup.sh   # обязан быть пустым
#
# Копия дословная, включая шапку про docker compose: любое "улучшение" одного файла без второго — это
# ровно тот случай, когда бэкапы в кластере тихо перестают совпадать с тем, что проверено локально.
#
# Отдельно про envsubst, потому что цена ошибки тут высокая: прогонять через него backup.sh нельзя. В
# скрипте свои шелловые переменные ($DEST, $STAMP, $KEEP), и envsubst без явного списка имён заменит их на
# пустые строки — скрипт останется синтаксически верным и начнёт писать дампы в /backups/ поверх друг
# друга. Джоба рендера обходит только *.yaml и передаёт envsubst явный список переменных; оба условия
# нужны, достаточно любого одного нарушить.
#
# Суффикс-хэш у ConfigMap не отключаем (никакого disableNameSuffixHash): правка скрипта меняет имя
# объекта, kustomize переписывает ссылку в CronJob, и в namespace остаётся видно, каким именно скриптом
# снят каждый ночной бэкап. Для CronJob это не про перезапуск — том с ConfigMap монтируется заново на
# каждый запуск, — а про разбор инцидента: под ссылается на конкретную версию скрипта.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob.yaml

configMapGenerator:
  - name: flow-backup-scripts
    files:
      - backup.sh
    options:
      labels:
        app.kubernetes.io/name: backup
        app.kubernetes.io/part-of: flow
