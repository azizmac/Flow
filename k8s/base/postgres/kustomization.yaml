# Модуль postgres: сама БД, её headless-сервис и Job создания второй базы flow_auth.
#
# Поля `namespace:` здесь нет: базу задаёт оверлей (k8s/overlays/home/postgres). Так один и тот же base
# годится для второго контура, а межнеймспейсные адреса при этом не разъезжаются — они приходят из
# ConfigMap flow-config, а не собираются подстановкой в манифестах.
#
# PVC flow-postgres-data в ресурсах отсутствует намеренно: все тома живут в слое k8s/base/storage и
# применяются отдельно и только вручную. Удаление этого модуля не должно уносить PGDATA.
#
# Метки app.kubernetes.io/* проставлены прямо на объектах, а не трансформером `labels:`. Причина — у
# Service есть spec.selector, и трансформер, настроенный писать в селекторы, испортил бы его; а вариант
# с includeSelectors: false оставил бы селектор StatefulSet без обязательных меток. Их всего три объекта,
# руками честнее. Метку релиза flow.io/release добавляет джоба рендера — в base её быть не должно.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Порядок перечисления на вывод не влияет (kustomize сортирует по kind), но читается он как порядок
# выкатки: сначала имя, по которому базу найдут, потом сама база, потом разовая задача поверх неё.
resources:
  - service.yaml
  - statefulset.yaml
