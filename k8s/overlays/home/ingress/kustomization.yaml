# Оверлей домашнего кластера, модуль ingress. Рендерится в manifests/ingress.yaml.
#
# Самый тонкий оверлей слоя приложения, и это честное состояние дел: в модуле нет ни одного контейнера,
# поэтому нет и секции `images:`. Всё, что зависит от кластера, — класс ingress-контроллера и три имени
# хостов — стоит в базе плейсхолдерами ${INGRESS_CLASS}, ${PUBLIC_CLIENT_HOST}, ${PUBLIC_API_HOST},
# ${PUBLIC_AUTH_HOST}, которые подставляет envsubst перед kustomize build.
#
# Три хостовые переменные — производные, а не новые: джоба рендера получает их из PUBLIC_*_URL прямо в
# шаге подстановки, отрезая схему и путь, и экспортирует наравне с остальными именами. Заводить их в
# GitHub Variables не надо — иначе рано или поздно хост разъедется со своим URL, а заметить это можно
# только из браузера. Почему хост вообще понадобился отдельно от URL, разобрано в шапке
# k8s/base/ingress/ingress.yaml: в поле host схема и порт недопустимы по схеме Kubernetes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow

resources:
  - ../../../base/ingress
