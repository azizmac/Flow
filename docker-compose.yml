services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3-init:
    image: minio/mc:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3_BUCKET: ${S3_BUCKET:-flow}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true
      "
    networks:
      - flow-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-flow};Username=${POSTGRES_USER:-flow};Password=${POSTGRES_PASSWORD:-flow}
      S3__Endpoint: http://s3:9000
      S3__AccessKey: ${MINIO_ROOT_USER:-flow}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3__Bucket: ${S3_BUCKET:-flow}
      S3__UseSsl: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - flow-network

networks:
  flow-network:
    name: flow-network
    driver: bridge

volumes:
  postgres-data:
  minio-data:
