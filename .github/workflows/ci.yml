# Оркестратор: триггеры + порядок джоб. Сами джобы лежат в отдельных файлах.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    uses: ./.github/workflows/build.yml

  docker:
    name: Docker image
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      # Публикуем только с main; из веток и PR образ лишь собирается.
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      # Если переменные registry не заданы, образ собирается под локальным именем.
      image: ${{ vars.REGISTRY && format('{0}/{1}', vars.REGISTRY, vars.IMAGE_NAME) || 'flow-api' }}
    secrets: inherit

  docker-auth:
    name: Docker image (Flow.Auth)
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      # Имя образа Auth — переменная AUTH_IMAGE_NAME (по умолчанию flow-auth рядом с IMAGE_NAME).
      image: ${{ vars.REGISTRY && format('{0}/{1}', vars.REGISTRY, vars.AUTH_IMAGE_NAME || 'flow-auth') || 'flow-auth' }}
      dockerfile: Dockerfile.auth
    secrets: inherit

  docker-client:
    name: Docker image (Flow.Client)
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      image: ${{ vars.REGISTRY && format('{0}/{1}', vars.REGISTRY, vars.CLIENT_IMAGE_NAME || 'flow-client') || 'flow-client' }}
      dockerfile: Dockerfile.client
    secrets: inherit
