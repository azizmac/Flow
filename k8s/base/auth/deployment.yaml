# Flow.Auth — сервер OpenIddict: выдаёт токены, держит учётные записи и страницу входа.
#
# Три решения в этом файле не обсуждаются, потому что за каждым стоит конкретная поломка:
#
# 1. replicas: 1 и strategy: Recreate. Схему БД накатывает сам процесс при старте (AuthDatabaseInitializer,
#    hosted service), а не отдельная миграционная джоба. Две реплики при RollingUpdate пошли бы мигрировать
#    одновременно — это гонка на DDL и заблокированные транзакции, а не «чуть медленнее». Второй повод не
#    слабее: /keys — это RWO-том, и при RollingUpdate новый под ждал бы освобождения тома, пока старый ждёт
#    готовности нового; Recreate снимает старый под до создания нового и разрывает этот клинч.
# 2. Без runAsNonRoot. В src/Flow.Auth/Dockerfile намеренно нет инструкции USER: сервис пишет в /keys
#    (ключи DataProtection), а каталог тома создаётся от root. Включённый non-root даёт не отказ при старте,
#    а отказ при первом обращении к ключам — то есть падение уже под нагрузкой.
# 3. Сертификаты приезжают Secret-ом и монтируются readOnly. Это защита от тихой деградации:
#    SelfSignedCertificates.LoadOrCreate при отсутствии файла молча создаёт новый самоподписанный PFX и пишет
#    один LogWarning. На readOnly-томе такая запись честно падает, и мы узнаём о пустом Secret сразу, а не
#    через неделю, когда «всех разлогинило» после перезапуска пода.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: flow
spec:
  replicas: 1
  strategy:
    type: Recreate
  # Верхняя граница со стороны кластера: kubectl rollout status без --timeout ждёт бесконечно, а
  # progressDeadlineSeconds ограничивает саму выкатку. 600 с заведомо больше бюджета startupProbe (240 с)
  # плюс времени на скачивание образа — то есть дедлайн не срабатывает раньше, чем проба вынесет вердикт.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
      app.kubernetes.io/part-of: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: flow
    spec:
      # Secret regcred создаёт джоба deploy-platform из пары REGISTRY_PULL_*, kustomize о нём не знает.
      # Ссылка стоит даже при публичных образах: она ничего не стоит, а при переводе репозитория в приватный
      # иначе получаешь ImagePullBackOff на ровном месте.
      imagePullSecrets:
        - name: regcred
      # Токен ServiceAccount поду не нужен: в API Kubernetes сервис не ходит. Отключаем монтирование,
      # чтобы чтение /var/run/secrets/... не давало ничего тому, кто окажется внутри контейнера.
      automountServiceAccountToken: false
      # Прибиваем к worker-ноде, потому что у пода есть диск. PV, созданный local-path, несёт nodeAffinity
      # на ту ноду, где он физически появился, и под на чужой ноде не запустится вовсе — но диагноз при этом
      # выглядит как «volume node affinity conflict», а не как «не та нода». Явный nodeSelector делает
      # ошибку читаемой и заодно фиксирует, где том создастся в первый раз: StorageClass с
      # WaitForFirstConsumer выбирает ноду по первому поду.
      nodeSelector:
        kubernetes.io/hostname: "${WORKER_NODE}"
      containers:
        - name: auth
          # Тег-заглушка: в кластер уезжает только digest, который подставляет джоба render
          # (kustomize edit set image). Если такой образ всё-таки доехал до ноды, ImagePullBackOff с именем
          # flow-auth:local — это и есть сообщение «манифест применили мимо рендера».
          image: flow-auth:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # envFrom здесь сознательно не используется, хотя ConfigMap flow-config один на все модули.
          # Причина техническая: подстановка $(VAR) видит только переменные, объявленные в env ЭТОГО же
          # контейнера выше по списку, и переменные из envFrom для неё не существуют — строку подключения
          # так не собрать. Причина вторая, не менее важная: явный список документирует, что именно читает
          # сервис, а envFrom затащил бы в под и настройки поиска, и адреса моделей, к которым Flow.Auth
          # отношения не имеет.
          env:
            # ---- Строка подключения собирается здесь, а не в ConfigMap ----
            # Пароль обязан жить в Secret: в ConfigMap он был бы виден в `kubectl get cm -o yaml` любому,
            # у кого есть чтение namespace. Поэтому части приходят по отдельности, а склеивает их сам
            # kubelet механизмом $(VAR). Оговорка на будущее: пароль с символами ; и = ломает разбор строки
            # подключения Npgsql — генерировать его стоит из букв, цифр и безопасной пунктуации.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: POSTGRES_HOST
            # Своя база, отдельная от базы приложения: Flow.Auth живёт в AUTH_DB (flow_auth), Flow.Api —
            # в POSTGRES_DB (flow). Создаёт её отдельный Job слоя данных, а не init.sql из образа:
            # init.sql отрабатывает только на пустом PGDATA.
            - name: AUTH_DB
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: AUTH_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_PASSWORD
            # Порт написан числом намеренно: 5432 зафиксирован контрактом на Service постгреса. Это
            # единственное значение из compose (POSTGRES_INTERNAL_PORT), которое в кластере перестало быть
            # переменной — публикацию портов там заменяет Service, а он всегда слушает 5432.
            - name: ConnectionStrings__Postgres
              value: "Host=$(POSTGRES_HOST);Port=5432;Database=$(AUTH_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"

            # ---- Внешние адреса: подставляются на рендере, а не берутся из ConfigMap ----
            # Сознательная асимметрия с внутренними адресами. Эти значения видит браузер, и они обязаны
            # совпадать между auth, api, client и хостами Ingress. Подставленные envsubst, они попадают прямо
            # в spec.template пода: изменение переменной меняет манифест и потому вызывает rollout. Приди они
            # через configMapKeyRef — правка ConfigMap не перезапустила бы под вовсе, и iss в токенах молча
            # остался бы прежним при «успешной» выкатке.
            #
            # Issuer уходит в claim iss и в discovery-документ. Разойдётся с адресом, по которому пришёл
            # браузер, — валидация токена провалится и у клиента, и у Flow.Api.
            - name: Auth__Issuer
              value: "${PUBLIC_AUTH_URL}"
            # Адреса возврата после входа и выхода. Хвосты путей заданы клиентом (Blazor
            # AuthenticationService), поэтому меняется только origin.
            # Индекс __0 перекрывает ровно нулевой элемент массива из appsettings.json, а он там ровно один —
            # то есть localhost-значение замещается целиком, а не дополняется. Появится второй публичный
            # адрес — понадобится и __1: сам он не подставится.
            - name: Auth__Client__RedirectUris__0
              value: "${PUBLIC_CLIENT_ORIGIN}/authentication/login-callback"
            - name: Auth__Client__PostLogoutRedirectUris__0
              value: "${PUBLIC_CLIENT_ORIGIN}/authentication/logout-callback"
            # CORS: Blazor-клиент ходит из браузера на discovery и /connect/token, то есть на другой origin.
            - name: Cors__Origins__0
              value: "${PUBLIC_CLIENT_ORIGIN}"

            # ---- TLS-зависимое ----
            # В контейнере окружение Production, а там Auth:AllowInsecureHttp по умолчанию false, то есть
            # OpenIddict требует https. На этапе 1 мы ходим через ingress по http, поэтому значение обязано
            # быть true — иначе сервис поднимется и будет отказывать на каждом запросе к /connect/*.
            - name: Auth__AllowInsecureHttp
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: AUTH_ALLOW_INSECURE_HTTP

            # ---- Сертификаты и ключи ----
            # Пути указывают в том, смонтированный из Secret flow-auth-certs (см. volumeMounts).
            - name: Auth__SigningCertificate__Path
              value: /certs/signing.pfx
            - name: Auth__EncryptionCertificate__Path
              value: /certs/encryption.pfx
            # Пароль один на оба PFX — так их делает docker/auth/make-certs.sh. Менять его можно только
            # вместе с самими файлами: при существующих PFX и другом пароле сервис падает с
            # CryptographicException и уходит в CrashLoopBackOff.
            - name: Auth__SigningCertificate__Password
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: AUTH_CERT_PASSWORD
            - name: Auth__EncryptionCertificate__Password
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: AUTH_CERT_PASSWORD
            # Ключи DataProtection: ими подписываются cookie входа и antiforgery. Без тома они пересоздаются
            # при каждом рестарте пода, и пользователи вылетают из сессии на ровном месте.
            - name: DataProtection__KeysPath
              value: /keys

            # ---- Секрет клиента flow-api ----
            # Нужен обоим сервисам одновременно и одинаковым: по нему Flow.Api получает токен admin-API.
            # Пустое значение — не деградация, а CrashLoopBackOff: ClientSeeder бросает InvalidOperationException.
            - name: Auth__ApiClient__Secret
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: AUTH_API_CLIENT_SECRET

            # ---- Первичная учётная запись ----
            # Bootstrap__Id обязан совпадать с таким же у Flow.Api: Flow.Auth заводит учётку, Flow.Api —
            # профиль владельца с тем же Id. Поэтому значение лежит в общем ConfigMap, а не у каждого своё.
            - name: Bootstrap__Enabled
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: BOOTSTRAP_ENABLED
            - name: Bootstrap__Id
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: BOOTSTRAP_ID
            - name: Bootstrap__Username
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: BOOTSTRAP_USERNAME
            - name: Bootstrap__Email
              valueFrom:
                configMapKeyRef:
                  name: flow-config
                  key: BOOTSTRAP_EMAIL
            # Пароль первичной учётки читает только Flow.Auth: Flow.Api хранит профиль, но не пароль
            # (Flow.Api.Bootstrap.BootstrapOptions свойства Password не имеет вовсе).
            - name: Bootstrap__Password
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: BOOTSTRAP_PASSWORD
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: keys
              mountPath: /keys
          # ---- Пробы ----
          # Три пробы отвечают на три разных вопроса, и объединять их нельзя.
          # live    — «процесс жив»: БД не трогает вовсе, иначе упавший Postgres перезапускал бы по кругу
          #           заведомо исправный контейнер, и вместо одной аварии мы получали бы две.
          # ready   — «можно слать трафик»: 200 только при живой БД. Именно по ней Service добавляет под
          #           в Endpoints, а kubectl rollout status считает выкатку успешной.
          # startup — тот же /health/ready, но с большим бюджетом.
          #
          # ТРЕБОВАНИЕ, А НЕ ПОЖЕЛАНИЕ: startupProbe у auth и api ОБЯЗАТЕЛЕН. Обоснование
          # экспериментальное, а не теоретическое. GenericWebHostService (сам Kestrel) регистрируется как
          # hosted service внутри WebApplicationBuilder.Build(), то есть ПОСЛЕ всех AddHostedService из Program.cs,
          # а хост запускает их строго в порядке регистрации. Значит сокет не открывается вообще, пока
          # StartAsync у AuthDatabaseInitializer не вернулся. Проверено запуском с недоступной БД: за
          # 25 секунд ожидания в логе ноль строк «Now listening», curl на /health/live не устанавливает
          # соединение вовсе.
          #
          # Из этого следует главное: во время ожидания БД и миграций недоступен НЕ ТОЛЬКО /health/ready,
          # но и /health/live. То есть рассуждение «лёгкая проба ответит сразу, её можно ставить без оглядки
          # на старт» здесь просто неверно. С дефолтными числами ниже (3 промаха по 10 с) livenessProbe
          # без startupProbe убила бы контейнер через полминуты после старта — то есть посреди первой
          # же миграции, и каждая следующая попытка начиналась бы заново: CrashLoopBackOff на исправном
          # сервисе с исправной БД. Пока startupProbe не прошла, kubelet не выполняет ни liveness, ни
          # readiness вовсе — именно этой гарантией закрывается окно, и другой защиты у нас нет.
          #
          # Флага вида «инициализация завершена» внутри приложения для этого недостаточно и вообще
          # бесполезен: к моменту, когда порт вообще отвечает, он всегда уже поднят. Защита живёт
          # ровно здесь, в манифесте.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            # timeoutSeconds ОБЯЗАН быть больше внутреннего таймаута самой проверки (AddCheck(…, timeout:)
            # в Program.cs, сейчас 2 с), иначе kubelet оборвёт соединение раньше, чем приложение
            # успеет отдать честный 503 с причиной в логе, и в событиях останется безликое
            # «context deadline exceeded». 3 с при внутренних 2 с — минимальный запас; уменьшать нельзя.
            timeoutSeconds: 3
            # Единственная неудача не должна выдёргивать под из Endpoints: у CanConnectAsync бывают
            # одиночные срывы при пересоединении к БД.
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            # БЮДЖЕТ: 48 × 5 с = 240 с, и отсчёт идёт от старта контейнера, а не от первого ответа:
            # сокет закрыт всё это время, и отказ в соединении считается таким же промахом, как 503.
            # Раскладка: 60 с ожидания Postgres (Startup:DatabaseWaitTimeoutSeconds) плюс 180 с запаса на
            # миграции Identity и OpenIddict и на сидеры клиента и владельца (BCrypt с WorkFactor 12 — сотни
            # миллисекунд на каждый хеш). У Flow.Api бюджет больше (300 с) — у него среди миграций
            # построение HNSW-индекса по halfvec, и одинаковые числа у двух сервисов были бы совпадением,
            # а не расчётом.
            #
            # Цепочка ограничителей, которую нельзя нарушать:
            #   бюджет startupProbe  <  DEPLOY_TIMEOUT  ≤  progressDeadlineSeconds (600 с).
            # Левое неравенство легко просмотреть: kubectl rollout status --timeout отсчитывает время
            # от apply, то есть в него входит и скачивание образа. С DEPLOY_TIMEOUT = 300 бюджет api (300 с)
            # не влезает вовсе, а бюджет auth (240 с) влезает только при мгновенном pull — и джоба
            # краснела бы на здоровой выкатке. Поэтому DEPLOY_TIMEOUT обязан быть не меньше 600 (§7.2 ТЗ).
            failureThreshold: 48
          resources:
            # Потолок памяти для .NET здесь не формальность: GC читает лимит cgroup и подстраивает под него
            # размер кучи. 512Mi хватает сервису с Razor-страницами и OpenIddict, а на двухнодовом кластере
            # выселение по памяти стоит дороже, чем чуть более частые сборки мусора.
            # CPU-лимит в одно ядро — из-за BCrypt: проверка пароля намеренно дорогая, и без потолка пачка
            # одновременных входов забрала бы у Postgres всю ноду.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            # runAsNonRoot здесь нет намеренно — см. пункт 2 в шапке файла. Остальное ужесточаем: ни запрет
            # на получение новых привилегий, ни сброс capabilities записи в /keys не мешают, а поверхность
            # атаки у root-контейнера сокращают заметно.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # Secret flow-auth-certs создаёт джоба deploy-platform из AUTH_SIGNING_PFX_B64 и
        # AUTH_ENCRYPTION_PFX_B64. Он есть только в namespace flow: больше эти файлы никому не нужны.
        - name: certs
          secret:
            secretName: flow-auth-certs
            # 0400: PFX читает только владелец процесса. Режим задан явно, потому что дефолтные 0644
            # на файле с приватным ключом — лишний пункт в любом будущем разборе.
            defaultMode: 0400
        # PVC объявлен в слое k8s/base/storage и применяется отдельно, вручную. Модуль только ссылается
        # на готовое имя: удаление Deployment не должно уносить ключи.
        - name: keys
          persistentVolumeClaim:
            claimName: flow-auth-keys
