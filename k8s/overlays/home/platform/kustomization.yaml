# Оверлей домашнего кластера, слой платформы. Рендерится в manifests/platform.yaml.
#
# Оверлей тонкий до предела, и это честное состояние дел, а не заготовка: в слое платформы нет ни одного
# значения, зависящего от кластера. Имена namespace фиксированы контрактом, образов нет вовсе (поэтому нет
# и секции `images`), плейсхолдеров под envsubst — тоже. Файл существует, потому что джоба рендера
# обходит оверлеи единообразно, и «у platform оверлея нет» стало бы исключением, которое надо помнить.
#
# Поля `namespace:` здесь нет по той же причине, что и в базе: трансформер namespace переименовал бы сами
# объекты Kind: Namespace, и вместо трёх namespace получился бы один. См. комментарий в
# k8s/base/platform/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/platform
