# Стек данных и вспомогательных сервисов: PostgreSQL, S3-совместимое хранилище и OpenCode. Живёт отдельным
# проектом Compose (name: flow-data), чтобы жизненный цикл данных не зависел от стека приложения:
# `docker compose down -v` в docker-compose.yml удаляет только контейнеры приложения.
#
# Тома и сеть — внешние, создаются один раз: `sh docker/data/init-env.sh`.
#
#   docker compose -f docker-compose.data.yml up -d        # поднять данные
#   docker compose -f docker-compose.data.yml down          # остановить (данные остаются в томах)
#   docker volume rm flow-postgres-data flow-minio-data     # осознанно удалить данные
#
# Эмбеддер поиска — профиль ai:
#   docker compose -f docker-compose.data.yml --profile ai up -d
name: flow-data

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
    ports:
      # По умолчанию порт виден только с самой машины: приложение ходит по сети Docker, наружу он нужен
      # разве что для psql. POSTGRES_BIND=0.0.0.0 открывает его всем — осознанное решение оператора.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3:
    # Тег зафиксирован: публикация образов MinIO CE прекращена в октябре 2025, репозиторий заархивирован
    # в феврале 2026 — latest давно не обновляется. Этот релиз последний с полной веб-консолью.
    # Замена хранилища (кандидат — Garage) решается в ТЗ вложений.
    # Источник — quay.io: из Docker Hub образы minio/minio уже сняты (pull access denied).
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3-init:
    # Тот же quay.io: в Docker Hub образа больше нет.
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3_BUCKET: ${S3_BUCKET:-flow}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true
      "
    networks:
      - flow-network

  opencode:
    # Агент запускается отдельно: `docker compose -f docker-compose.data.yml --profile agent up -d opencode`.
    # Тег образа фиксируется в .env, чтобы обновление OpenCode было осознанным.
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:2.0.0}
    profiles: ["agent"]
    restart: unless-stopped
    command: serve --hostname 0.0.0.0 --port 4096
    working_dir: /workspaces
    environment:
      OPENCODE_CONFIG: /config/opencode.jsonc
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-flow-opencode-local}
    volumes:
      # Flow.Api клонирует и обновляет репозитории; OpenCode только читает их.
      - repository-workspaces:/workspaces:ro
      - ./docker/opencode/opencode.jsonc:/config/opencode.jsonc:ro
    ports:
      # HTTP API доступен с хоста для диагностики, но не из локальной сети.
      - "${OPENCODE_BIND:-127.0.0.1}:${OPENCODE_PORT:-4096}:4096"
    extra_hosts:
      # Адрес LM Studio, запущенного на хост-машине, из Docker-сети.
      - "host.docker.internal:host-gateway"
    networks:
      - flow-network

  # Эмбеддер поиска: llama-server с Qwen3-Embedding по OpenAI-совместимому /v1/embeddings.
  # Профиль ai включается явно:
  #   docker compose -f docker-compose.data.yml --profile ai up -d
  # Веса кладут во внешний том flow-models-data (создаёт docker/data/init-env.sh, путь задаёт MODELS_ROOT):
  # это тяжёлые данные со своим жизненным циклом, пересборка приложения их не трогает.
  # Если модель крутится на другой машине (GPU), сервис не поднимают вовсе — EMBEDDINGS_QUERY_ENDPOINT
  # просто указывает наружу. Межстековых depends_on нет: недоступность модели — деградация поиска, не сбой старта.
  embeddings:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["ai"]
    restart: unless-stopped
    # --pooling last обязателен для Qwen3-Embedding: пулинг по последнему токену делает сам сервер.
    command: >
      --model /models/${EMBEDDINGS_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      --alias ${EMBEDDINGS_MODEL:-Qwen3-Embedding-0.6B}
      --embedding --pooling last
      --ctx-size 8192 --batch-size 8192 --ubatch-size 8192
      --host 0.0.0.0 --port 8081
    volumes:
      - models-data:/models
    ports:
      - "${EMBEDDINGS_BIND:-127.0.0.1}:${EMBEDDINGS_PORT:-8081}:8081"
    # Свой healthcheck: встроенный в образ стучится на 8080, а сервер поднят на 8081 —
    # без переопределения контейнер вечно «unhealthy» при исправно работающей модели.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Веса грузятся с диска: на холодном старте первая проба не должна считаться провалом.
      start_period: 60s
    networks:
      - flow-network

  # Вторая ступень поиска: cross-encoder переупорядочивает два десятка отобранных кандидатов.
  # Тот же профиль ai, но образ с CUDA и видеокарта: на CPU прогон пар занимает десятки секунд,
  # и ступень теряет смысл. Нет GPU — не поднимайте сервис, поиск останется одноступенчатым
  # (Search:Rerank:Enabled=false, кнопка «Точнее» в интерфейсе не появится).
  #
  #   docker compose -f docker-compose.data.yml --profile ai up -d reranker
  reranker:
    image: ${RERANKER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    profiles: ["ai"]
    restart: unless-stopped
    # Модель не из ТЗ: там назван Qwen3-Reranker-0.6B, но это causal LM без классификационной головы —
    # llama.cpp честно пишет «model default pooling_type is [-1]» и считает оценки по последнему токену,
    # то есть ранжирует мусором (проверено: правильный документ получал оценку на три порядка ниже
    # постороннего). Режим --reranking рассчитан на cross-encoder с головой, каким и является
    # bge-reranker-v2-m3: многоязычный, сильный на русском, того же размера.
    command: >
      --model /models/${RERANKER_MODEL_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
      --alias ${RERANKER_MODEL:-bge-reranker-v2-m3}
      --reranking --pooling rank
      --ctx-size 8192 --batch-size 8192 --ubatch-size 8192
      --gpu-layers ${RERANKER_GPU_LAYERS:-99}
      --host 0.0.0.0 --port 8082
    volumes:
      - models-data:/models
    ports:
      - "${RERANKER_BIND:-127.0.0.1}:${RERANKER_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - flow-network

  # Визуальные эмбеддинги картинок: скриншот находится по описанию того, что на нём, без OCR.
  # Сервис — vLLM, а не llama.cpp, и это проверено: llama.cpp грузит проектор и видит картинку в чате,
  # но из эндпоинта эмбеддингов её выбрасывает — вектор красного квадрата совпадает с вектором синего.
  #
  # VLLM_WSL2_ENABLE_PIN_MEMORY=1 обязателен под Docker Desktop: vLLM выключает pinned memory при WSL,
  # а без неё v1-движок не стартует («UVA is not available»). Ядру нужно 4.19.121 и новее.
  #
  #   docker compose -f docker-compose.data.yml --profile ai up -d embeddings-vl
  embeddings-vl:
    image: ${VISION_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["ai"]
    restart: unless-stopped
    command: >
      --model ${VISION_MODEL_REPO:-Qwen/Qwen3-VL-Embedding-2B}
      --served-model-name ${VISION_MODEL:-Qwen3-VL-Embedding-2B}
      --runner pooling --trust-remote-code
      --max-model-len ${VISION_MAX_LEN:-8192}
      --gpu-memory-utilization ${VISION_GPU_FRACTION:-0.35}
      --host 0.0.0.0 --port 8083
    environment:
      # Веса живут в том же томе, что и остальные модели: своя жизнь, пересборка приложения их не трогает.
      HF_HOME: /models/hf
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - models-data:/models
    ports:
      - "${VISION_BIND:-127.0.0.1}:${VISION_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8083/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      # Модель на 2B грузится дольше текстовых: первая проба не должна считаться провалом.
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - flow-network

  # Бэкапы по расписанию. По умолчанию выключены — профиль включается явно:
  #   docker compose -f docker-compose.data.yml --profile backup up -d
  # Разовый бэкап тем же контейнером и тем же скриптом:
  #   docker compose -f docker-compose.data.yml --profile backup run --rm backup /scripts/backup.sh
  backup:
    image: pgvector/pgvector:pg16
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-flow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-flow}
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./docker/data:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # Объекты S3 копируются с диска: том примонтирован на запись, потому что тот же контейнер восстанавливает.
      - minio-data:/minio-data
    # Именно command, а не entrypoint: тогда разовый запуск подменяет его на нужный скрипт
    # (docker compose run --rm backup /scripts/backup.sh).
    command: ["/scripts/scheduler.sh"]
    networks:
      - flow-network

networks:
  # Общая сеть обоих стеков, создаётся docker/data/init-env.sh.
  flow-network:
    name: flow-network
    external: true

volumes:
  # Внешние тома: Compose их не создаёт и, главное, не удаляет — данные переживают любой `down -v`.
  postgres-data:
    name: flow-postgres-data
    external: true
  minio-data:
    name: flow-minio-data
    external: true
  # Веса моделей: том внешний по той же причине, что и данные — `docker compose down -v` их не уносит,
  # а перекачивать гигабайты заново дорого.
  models-data:
    name: flow-models-data
    external: true
  # Локальные checkout'ы исходного кода: Flow.Api пишет в том, OpenCode читает его в режиме read-only.
  repository-workspaces:
    name: flow-repository-workspaces
    external: true
