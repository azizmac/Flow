# Всё, что отличает под с картой от пода без карты: рантайм, нода, заявка на карту и размеры буферов.
# Ни аргументов, ни проб, ни томов здесь нет — и это хороший признак: профиль железа описывает железо,
# а не сервис.
#
# Патч стратегического слияния, а не JSON6902: список containers сливается по ключу name, поэтому
# индекс контейнера здесь не фигурирует и переставить контейнеры местами безопасно.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-ai
spec:
  template:
    spec:
      # Нужна ли эта строка — вопрос, на который отвечает ровно одна команда: kubectl get runtimeclass.
      #   * nvidia-ctk runtime configure --runtime=containerd БЕЗ --set-as-default (именно этот вариант
      #     записан в §1.3 ТЗ) регистрирует nvidia отдельным обработчиком, а default_runtime_name остаётся
      #     runc. Тогда под без runtimeClassName стартует обычным runc, библиотек и устройств NVIDIA внутри
      #     нет, и llama.cpp тихо считает на процессоре — то есть строка обязательна;
      #   * GPU Operator и nvidia-ctk ... --set-as-default делают nvidia рантаймом по умолчанию. Тогда
      #     строка не нужна, но и не вредит: RuntimeClass nvidia в таких установках всё равно создаётся;
      #   * а вот если RuntimeClass с именем nvidia в кластере НЕ создан, под будет отклонён admission'ом
      #     («RuntimeClass … not found») и не запустится, даже когда рантайм на ноде настроен правильно.
      # Это единственный случай, когда строку надо убрать, и проверяется он до первой выкатки.
      runtimeClassName: nvidia
      # Нода с картой. На домашнем кластере GPU_NODE и WORKER_NODE — одна машина, и это не совпадение,
      # а условие работоспособности: том flow-models общий с Job'ом закачки и модулем картинок, а
      # ReadWriteOnce у local-path означает «один узел». Разъедутся переменные — получим Multi-Attach.
      nodeSelector:
        kubernetes.io/hostname: "${GPU_NODE}"
      containers:
        - name: ai
          # Размеры буферов под конкретную карту. Значения не подобраны «на глаз», а измерены на
          # GTX 1650 SUPER (4 ГБ, свободно 3715 МиБ) — той самой, ради которой профиль и существует:
          #
          #   ubatch-size 8192 (процессорный дефолт) — ОТКАЗ: сервер просит 4932 МиБ только под
          #                     вычислительный буфер, cudaMalloc failed, эмбеддер не грузится вовсе;
          #   ubatch-size 2048 — эмбеддер занимает 2678 МиБ;
          #   ubatch-size 1024 — 2196 МиБ;
          #   ubatch-size  512 — 1890 МиБ при ctx-size 8192 и 1212 МиБ при ctx-size 2048.
          #
          # Отсюда 2048/512/512: с ними в карту помещаются ВСЕ модели пресета одновременно — 2824 МиБ
          # из 3715, свободно 892, — и ни одна не вытесняется посреди запроса. Проверено сценарием
          # целиком: батч индексации из 16 боевых чанков 5.7 с (на трёх ядрах процессора этой ноды
          # было бы 60.9 с при таймауте клиента 60 с, то есть отказ), повторный батч после загрузки
          # всех моделей — 5.0 с, деградации нет.
          #
          # Ниже 512 у ubatch-size опускаться нельзя: у эмбеддера неказуальный пулинг, и llama.cpp
          # требует, чтобы последовательность целиком влезла в один ubatch, а боевой чанк — 512 токенов.
          # Карта крупнее — значения можно поднимать, начиная с ubatch-size; порядок выигрыша смотреть
          # по таблице выше, он нелинейный.
          env:
            - name: AI_CTX_SIZE
              value: "2048"
            - name: AI_BATCH_SIZE
              value: "512"
            - name: AI_UBATCH_SIZE
              value: "512"
          resources:
            limits:
              # Только в limits, и это не небрежность: для extended resources Kubernetes сам приравнивает
              # requests к limits, а дробные значения (0.5 карты) запрещены схемой. Отсюда же правило
              # «этот профиль и модуль картинок вместе включать нельзя», пока на ноде нет time-slicing:
              # двойка из целых единиц на одной карте не собирается.
              nvidia.com/gpu: 1
