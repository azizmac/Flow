# Метки нашего self-hosted раннера. Без этого списка actionlint считает их опечаткой в runs-on, потому что
# знает только про раннеров GitHub. Джоба выкатки нацелена на [self-hosted, flow]: раннер стоит на самом
# сервере Flow и выкатывает docker compose прямо там.
self-hosted-runner:
  labels:
    - flow
    - home
