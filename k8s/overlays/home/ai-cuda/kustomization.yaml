# Оверлей домашнего кластера, текстовый ИИ на видеокарте NVIDIA. Рендерится в manifests/ai-cuda.yaml.
#
# От соседнего ../ai отличается ровно двумя вещами: подключённым компонентом профиля железа и вариантом
# образа. Всё остальное — аргументы, пресет моделей, пробы, тома, лимиты — общее, потому что лежит в базе.
# Это и есть смысл затеи: разный только тег и три поля про карту, а не два разных сервиса.
#
# Применяется вместо ../ai, а не вместе с ним: это один и тот же Deployment flow-ai, просто в другом
# профиле. Какой из двух выкатывать, решает переменная AI_BACKEND.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow-ai

resources:
  - ../../../base/ai

# Порядок важен: компоненты применяются после resources и до трансформеров этого оверлея.
components:
  - ../../../components/gpu-nvidia

# Тот же образ по имени, что у CPU-профиля, но вариант сборки другой. Именно поэтому два профиля живут
# в разных оверлеях: трансформер images сопоставляет по имени без тега, и собранные одним оверлеем они
# получили бы один digest на двоих.
images:
  - name: ghcr.io/ggml-org/llama.cpp
    newTag: server-cuda
