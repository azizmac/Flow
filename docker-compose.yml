# Базовый пользователь (Owner) при первом запуске — один и тот же в auth (учётная запись) и api (профиль).
# См. docs/TZ_auth.md, секция Bootstrap. Пароль после первого входа лучше сменить в профиле.
x-bootstrap: &bootstrap
  Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-true}
  Bootstrap__Id: ${BOOTSTRAP_ID:-11111111-1111-1111-1111-111111111111}
  Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
  Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@flow.com}
  Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-admin}
  Bootstrap__FirstName: ${BOOTSTRAP_FIRST_NAME:-Admin}
  Bootstrap__LastName: ${BOOTSTRAP_LAST_NAME:-Flow}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Создаёт вторую базу flow_auth при инициализации тома (только при первом старте).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3-init:
    image: minio/mc:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3_BUCKET: ${S3_BUCKET:-flow}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true
      "
    networks:
      - flow-network

  auth:
    build:
      context: .
      dockerfile: src/Flow.Auth/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *bootstrap
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${AUTH_DB:-flow_auth};Username=${POSTGRES_USER:-flow};Password=${POSTGRES_PASSWORD:-flow}
      # Issuer — адрес, который видит браузер: он же попадает в iss токенов и в discovery.
      Auth__Issuer: ${AUTH_ISSUER:-http://localhost:5100}
      Auth__Client__RedirectUris__0: http://localhost:${CLIENT_PORT:-5016}/authentication/login-callback
      Auth__Client__PostLogoutRedirectUris__0: http://localhost:${CLIENT_PORT:-5016}/authentication/logout-callback
      Auth__ApiClient__Secret: ${AUTH_API_CLIENT_SECRET:-dev-only-change-me}
      # Локальный compose ходит по http; за TLS-терминатором оставить false.
      Auth__AllowInsecureHttp: ${AUTH_ALLOW_INSECURE_HTTP:-true}
      # PFX создаются сервисом сами при первом старте (Security/SelfSignedCertificates) в volume auth-certs;
      # свои сертификаты можно положить туда же или примонтировать вместо volume.
      Auth__SigningCertificate__Path: /certs/signing.pfx
      Auth__SigningCertificate__Password: ${AUTH_CERT_PASSWORD:-flow-certs}
      Auth__EncryptionCertificate__Path: /certs/encryption.pfx
      Auth__EncryptionCertificate__Password: ${AUTH_CERT_PASSWORD:-flow-certs}
      DataProtection__KeysPath: /keys
      Cors__Origins__0: http://localhost:${CLIENT_PORT:-5016}
    volumes:
      - auth-certs:/certs
      - auth-keys:/keys
    ports:
      - "${AUTH_PORT:-5100}:8080"
    networks:
      - flow-network

  api:
    build:
      context: .
      dockerfile: src/Flow.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      <<: *bootstrap
      # Flow.Api → Flow.Auth: discovery/JWKS по внутреннему адресу (IssuerRewritingConfigurationRetriever),
      # issuer в токенах — внешний (Auth__Issuer). Внутри compose всё по http.
      Auth__BaseUrl: http://auth:8080
      Auth__Issuer: ${AUTH_ISSUER:-http://localhost:5100}
      Auth__RequireHttpsMetadata: "false"
      Auth__ApiClient__Secret: ${AUTH_API_CLIENT_SECRET:-dev-only-change-me}
      Cors__Origins__0: http://localhost:${CLIENT_PORT:-5016}
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-flow};Username=${POSTGRES_USER:-flow};Password=${POSTGRES_PASSWORD:-flow}
      S3__Endpoint: http://s3:9000
      S3__AccessKey: ${MINIO_ROOT_USER:-flow}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3__Bucket: ${S3_BUCKET:-flow}
      S3__UseSsl: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - flow-network

  client:
    build:
      context: .
      dockerfile: src/Flow.Client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
    environment:
      # Адреса, которые видит браузер: порты наружу из этого же файла.
      API_BASE_URL: http://localhost:${API_PORT:-8080}
      AUTH_BASE_URL: ${AUTH_ISSUER:-http://localhost:5100}
    ports:
      - "${CLIENT_PORT:-5016}:80"
    networks:
      - flow-network

networks:
  flow-network:
    name: flow-network
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  auth-keys:
  auth-certs:
