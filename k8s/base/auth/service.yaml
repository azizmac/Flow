# Внутрикластерный адрес Flow.Auth: http://flow-auth.flow.svc.cluster.local:8080.
#
# По нему в сервис ходит Flow.Api за discovery, JWKS и admin-API (переменная INTERNAL_AUTH_URL), и он же
# стоит бэкендом у Ingress auth. Снаружи в кластер этот Service не смотрит: тип ClusterIP, публикацию
# наружу делает только Ingress. Порт 8080 — тот же, что внутри контейнера, и это сознательно: разные номера
# снаружи и внутри добавили бы один лишний факт, который нужно помнить при чтении логов и port-forward.
#
# Селектор — только две метки модуля, без метки релиза flow.io/release. У Service селектор мутабельный, и
# формально релиз в него положить можно, но тогда между apply нового Service и появлением новых подов
# Endpoints оказывались бы пустыми — то есть выкатка сама себе устраивала бы простой. Правило одно для всех
# объектов: релиз живёт в metadata.labels, в селекторах его нет никогда.
apiVersion: v1
kind: Service
metadata:
  name: flow-auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: flow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: flow
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
