# Слой приложения, модуль auth: Deployment и Service Flow.Auth.
#
# Поля `namespace:` здесь нет: база описывает, ЧТО выкатывается, а КУДА — решает оверлей
# (k8s/overlays/home/auth). Так второй контур поднимается новым оверлеем, а не правкой базы.
# Секции `images:` тоже нет: образ в базе — заглушка flow-auth:local, точку подстановки объявляет оверлей,
# а digest в неё вписывает джоба render.
#
# PVC flow-auth-keys и Secret-ы flow-secrets / flow-auth-certs / regcred в ресурсы не входят намеренно:
# тома живут в отдельном слое k8s/base/storage и применяются вручную, а секреты создаёт джоба
# deploy-platform из GitHub Secrets. В репозитории не лежит ни одного секрета, и kustomize их не создаёт.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
