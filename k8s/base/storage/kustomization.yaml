# Слой хранилища: пять PVC в трёх разных namespace.
#
# Поля `namespace:` здесь нет намеренно. Тома лежат в разных namespace (flow-data, flow, flow-ai), поэтому
# единственного значения для трансформера не существует — namespace каждого PVC записан в самом объекте.
# Если однажды захочется поднять второй контур с другими именами namespace, это будет отдельный оверлей
# с патчами, а не одна строка здесь: иначе межнеймспейсные FQDN в модулях разъедутся с реальностью.
#
# Метки проставлены прямо на объектах, а не трансформером `labels:`. Причина та же, что у метки релиза:
# у PersistentVolumeClaim есть собственный spec.selector (для привязки к статическому PV), и трансформер,
# настроенный на запись в селекторы, испортил бы его. Проще и честнее написать метки руками — их пять.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
