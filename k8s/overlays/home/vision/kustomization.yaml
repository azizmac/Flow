# Оверлей домашнего кластера, модуль визуального поиска. Рендерится в manifests/vision.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow-ai

resources:
  - ../../../base/vision

# Тег зафиксирован и здесь, а не только в базе: переменная VISION_IMAGE позволяет сменить версию движка
# кликом, и ровно поэтому версия обязана быть видна в двух местах, а не подразумеваться. latest в этой
# строке недопустим — с ним две выкатки подряд дают разные движки, а откат становится невозможен.
images:
  - name: vllm/vllm-openai
    newTag: v0.10.1
