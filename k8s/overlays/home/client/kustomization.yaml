# Оверлей домашнего кластера, модуль client. Рендерится в manifests/client.yaml.
#
# namespace — потому что в базе его нет; images — точка, куда джоба render впишет digest командой
# `kustomize edit set image flow-client=$REGISTRY/$IMAGE_PREFIX/flow-client@sha256:...`
# (разбор — в k8s/overlays/home/auth/kustomization.yaml).
#
# Отдельно стоит помнить: образ клиента пересобирается не только от правок src/Flow.Client, но и от правок
# docker/client/** — nginx.conf и entrypoint.sh лежат прямо в образе, и подстановка адресов держится
# на втором из них. Это учтено фильтрами джобы changes, а не здесь, но знать полезно: при выкатке
# «поменял только entrypoint» новый digest обязан появиться.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow

resources:
  - ../../../base/client

images:
  - name: flow-client
    newTag: local
