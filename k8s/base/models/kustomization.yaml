# Модуль закачки весов: один Job и больше ничего. Service ему не нужен, Deployment'а нет намеренно —
# это разовое действие, а не сервис (подробнее о том, почему не initContainer, — в самом манифесте).
#
# Отдельный модуль ещё и потому, что у него другой профиль риска: он единственный в слое монтирует том
# моделей на запись ради записи и единственный ходит в интернет за гигабайтами. Отдельная джоба — это
# отдельная кнопка, которую не нажимают случайно вместе с выкаткой сервисов.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pull-models.yaml
