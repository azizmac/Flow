# Оверлей домашнего кластера, модуль auth. Рендерится в manifests/auth.yaml.
#
# Оверлей делает ровно две вещи, и обе — про «куда», а не про «что»:
#   namespace — в базе его нет намеренно, чтобы второй контур поднимался новым оверлеем, а не правкой базы;
#   images    — объявляет точку подстановки образа.
#
# Про images подробнее, потому что запись выглядит бессмысленной. Реестр и владелец приходят из переменных
# (REGISTRY, IMAGE_PREFIX), а сам образ — digest-ом из джобы resolve-images; в репозитории нет ни того, ни
# другого, и написать здесь готовую строку невозможно. Строку целиком перепишет джоба render командой
#   kustomize edit set image flow-auth=$REGISTRY/$IMAGE_PREFIX/flow-auth@sha256:...
# Она находит запись по полю name, поэтому запись нужна как объявление: в ней видно, что образ у модуля
# один и подставляется он именно сюда. Тег local — тот же, что в базе: если такой образ доехал до ноды,
# значит манифест применили мимо рендера, и ImagePullBackOff об этом честно сообщит.
#
# Патчей здесь нет и, надеюсь, не появится: всё, что зависит от кластера, уже вынесено в плейсхолдеры
# ${WORKER_NODE} и ${PUBLIC_*}, которые подставляет envsubst перед kustomize build. Патч ради одного
# значения — это второе место, где его надо не забыть поменять.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow

resources:
  - ../../../base/auth

images:
  - name: flow-auth
    newTag: local
