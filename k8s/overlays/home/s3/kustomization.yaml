# Оверлей домашнего кластера, слой хранилища объектов. Рендерится в manifests/s3.yaml.
#
# Что оверлей добавляет к базе: namespace и пару образов. Значения, зависящие от кластера (${WORKER_NODE}),
# стоят плейсхолдерами прямо в базе — envsubst в джобе рендера подставит их до kustomize build. Патчить
# nodeSelector отсюда было бы хуже: патч пришлось бы повторять для каждого нового объекта со своим
# nodeSelector, и забытый патч не падает, а тихо разрешает поду уехать на другую ноду.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Хранилище живёт в namespace данных, отдельно от приложения: опечатка в джобе приложения не должна
# доставать до PVC с вложениями. Namespace создаёт слой платформы (k8s/base/platform).
namespace: flow-data

resources:
  - ../../../base/s3

# Теги здесь повторяют базу, и это не дублирование ради дублирования: секция перечисляет образы, которые
# джоба релиза заменит на digest (kustomize edit set image quay.io/minio/minio=...@sha256:...). Пока она
# этого не сделала, оверлей собирается сам по себе и даёт рабочий манифест — например при локальной
# проверке kubectl kustomize. В кластер же уезжает только digest: подвижный тег не даёт kubectl apply
# заметить изменение, и rollout просто не произойдёт.
images:
  - name: quay.io/minio/minio
    newTag: RELEASE.2025-04-22T22-12-26Z
  - name: quay.io/minio/mc
    newTag: RELEASE.2025-04-16T18-13-26Z
