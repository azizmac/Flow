# Стек данных и вспомогательных сервисов: PostgreSQL, S3-совместимое хранилище и OpenCode. Живёт отдельным
# проектом Compose (name: flow-data), чтобы жизненный цикл данных не зависел от стека приложения:
# `docker compose down -v` в docker-compose.yml не удаляет внешние тома данных и репозиториев.
#
# Тома и сеть — внешние, создаются один раз: `sh docker/data/init-env.sh` (Windows: init-env.ps1).
#
#   docker compose -f docker-compose.data.yml up -d        # PostgreSQL, S3 и OpenCode
#   docker compose -f docker-compose.data.yml down          # остановить (данные остаются в томах)
#   docker volume rm flow-postgres-data flow-minio-data     # осознанно удалить данные
#
# Эмбеддер поиска — профиль ai:
#   docker compose -f docker-compose.data.yml --profile ai up -d
# OpenCode отдельного профиля не требует. LM Studio/Qwen запускаются на хосте, не в этом файле.
# Настройка модели и проверка формы агента: docs/OpenCode_setup.md.
name: flow-data

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
    ports:
      # По умолчанию порт виден только с самой машины: приложение ходит по сети Docker, наружу он нужен
      # разве что для psql. POSTGRES_BIND=0.0.0.0 открывает его всем — осознанное решение оператора.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3:
    # Форк MinIO от Pigsty (github.com/pgsty/minio, AGPL): апстрим прекратил публикацию образов CE в
    # октябре 2025 и заархивировал репозиторий, а в сентябре 2026 образы исчезли и с Docker Hub, и с
    # quay.io. Форк — тот же бинарь: тот же протокол, те же MINIO_ROOT_*, mc внутри для healthcheck и
    # веб-консоль, а том, записанный прежним quay.io/minio/minio:RELEASE.2025-04-22, читает без миграции
    # (проверено). Тег зафиксирован.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow-network

  s3-init:
    # mc из того же форка: апстримного образа тоже нет ни на Docker Hub, ни на quay.io.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flow12345}
      S3_BUCKET: ${S3_BUCKET:-flow}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true
      "
    networks:
      - flow-network

  opencode:
    # HTTP-сервер агента: serve, без запуска TUI. Стартует вместе с PostgreSQL и S3.
    # Flow открывается на :8080/agents/test, не на порту OpenCode :4096.
    # Тег образа фиксируется в .env, чтобы обновление OpenCode было осознанным.
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:2.0.0}
    restart: unless-stopped
    command: serve --hostname 0.0.0.0 --port 4096
    working_dir: /workspaces
    environment:
      OPENCODE_CONFIG: /config/opencode.jsonc
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-flow-opencode-local}
    volumes:
      # Flow.Api клонирует и обновляет репозитории; OpenCode только читает их.
      - repository-workspaces:/workspaces:ro
      - ./docker/opencode/opencode.jsonc:/config/opencode.jsonc:ro
    ports:
      # HTTP API доступен с хоста для диагностики, но не из локальной сети.
      - "${OPENCODE_BIND:-127.0.0.1}:${OPENCODE_PORT:-4096}:4096"
    extra_hosts:
      # Адрес LM Studio на хосте; localhost внутри контейнера означал бы сам OpenCode.
      # LM Studio должен принимать соединения из Docker; baseURL задан в opencode.jsonc.
      - "host.docker.internal:host-gateway"
    networks:
      - flow-network

  # Текстовая половина поиска: один llama-server отдаёт и эмбеддинги, и реранк.
  # Профиль ai включается явно:
  #   docker compose -f docker-compose.data.yml --profile ai up -d
  # С видеокартой NVIDIA — тем же способом плюс оверлей железа:
  #   docker compose -f docker-compose.data.yml -f docker/ai/nvidia.yml --profile ai up -d
  #
  # Почему один сервис на две модели. llama-server умеет router-режим: запускается без --model, читает
  # docker/ai/models.ini и сам поднимает отдельный процесс под каждую модель, маршрутизируя запросы по
  # полю "model" в теле. Отсюда два следствия. Первое: адрес один, и EMBEDDINGS_QUERY_ENDPOINT с
  # RERANK_ENDPOINT указывают на один и тот же порт. Второе: модель грузится по первому обращению,
  # поэтому при RERANK_ENABLED=false реранкер не занимает ни байта.
  #
  # Ни --embedding, ни --reranking, ни --pooling здесь быть не должно. Аргументы командной строки
  # наследуются всеми процессами моделей и имеют высший приоритет, поэтому глобальный --reranking
  # форсит pooling_type=4, и эмбеддер начинает молча отдавать нули — ошибка без единой записи в логе.
  # Режимы задаются пер-модельно в models.ini, и только там.
  #
  # Веса кладут во внешний том flow-models-data (создаёт docker/data/init-env.sh, путь задаёт MODELS_ROOT):
  # это тяжёлые данные со своим жизненным циклом, пересборка приложения их не трогает. Если модели
  # крутятся на другой машине, сервис не поднимают вовсе — эндпоинты просто указывают наружу.
  # Межстековых depends_on нет: недоступность модели — деградация поиска, а не сбой старта.
  ai:
    image: ${AI_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["ai"]
    restart: unless-stopped
    # Размеры буферов — аргументами, а не ключами в models.ini: пресет общий у стенда и кластера,
    # а буфер зависит от машины. Дефолты процессорные; профиль карты (docker/ai/nvidia.yml) ставит свои,
    # потому что ubatch-size 8192 требует почти 5 ГиБ видеопамяти и на картах до 8 ГБ это отказ.
    command: >
      --models-preset /config/models.ini
      --models-max 3
      --no-webui
      --threads ${AI_THREADS:-4}
      --ctx-size ${AI_CTX_SIZE:-8192}
      --batch-size ${AI_BATCH_SIZE:-8192}
      --ubatch-size ${AI_UBATCH_SIZE:-8192}
      --host 0.0.0.0 --port 8081
    volumes:
      - models-data:/models
      # Одним файлом, а не каталогом: рядом лежит оверлей железа, и монтировать его контейнеру незачем.
      - ./docker/ai/models.ini:/config/models.ini:ro
    ports:
      - "${AI_BIND:-127.0.0.1}:${AI_PORT:-8081}:8081"
    # Свой healthcheck: встроенный в образ стучится на 8080, а сервер поднят на 8081 —
    # без переопределения контейнер вечно «unhealthy» при исправно работающей модели.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Веса грузятся с диска: на холодном старте первая проба не должна считаться провалом.
      start_period: 60s
    networks:
      - flow-network

  # Бэкапы по расписанию. По умолчанию выключены — профиль включается явно:
  #   docker compose -f docker-compose.data.yml --profile backup up -d
  # Разовый бэкап тем же контейнером и тем же скриптом:
  #   docker compose -f docker-compose.data.yml --profile backup run --rm backup /scripts/backup.sh
  backup:
    # Alpine, а не образ базы: расписание держит busybox crond (scheduler.sh), а в Debian-образе
    # pgvector его нет — контейнер падал с «crond: not found» и перезапускался по кругу, бэкапов не было.
    # pgvector клиенту не нужен: pg_dump расширение не использует, а CREATE EXTENSION из дампа выполняет
    # сервер. Мажорная версия обязана совпадать с postgres выше — pg_dump старше сервера не снимет дамп.
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-flow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-flow}
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./docker/data:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # Объекты S3 копируются с диска: том примонтирован на запись, потому что тот же контейнер восстанавливает.
      - minio-data:/minio-data
    # Именно command, а не entrypoint: тогда разовый запуск подменяет его на нужный скрипт
    # (docker compose run --rm backup /scripts/backup.sh).
    command: ["/scripts/scheduler.sh"]
    networks:
      - flow-network

networks:
  # Общая сеть обоих стеков, создаётся docker/data/init-env.sh.
  flow-network:
    name: flow-network
    external: true

volumes:
  # Внешние тома: Compose их не создаёт и, главное, не удаляет — данные переживают любой `down -v`.
  postgres-data:
    name: flow-postgres-data
    external: true
  minio-data:
    name: flow-minio-data
    external: true
  # Веса моделей: том внешний по той же причине, что и данные — `docker compose down -v` их не уносит,
  # а перекачивать гигабайты заново дорого.
  models-data:
    name: flow-models-data
    external: true
  # Локальные checkout'ы исходного кода: Flow.Api пишет в том, OpenCode читает его в режиме read-only.
  repository-workspaces:
    name: flow-repository-workspaces
    external: true
