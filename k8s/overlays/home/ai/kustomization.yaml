# Оверлей домашнего кластера, текстовый ИИ на процессоре. Рендерится в manifests/ai.yaml.
#
# Это профиль по умолчанию: машина без видеокарты — не особый случай, а основной путь. Профиль с картой
# лежит рядом отдельным оверлеем (../ai-cuda) и отличается от этого двумя строками. Два статичных оверлея
# вместо одного с переключателем выбраны намеренно: оба собираются и проверяются в CI на каждом прогоне,
# поэтому «на CPU не собралось» обнаруживается до выкатки, а не в момент, когда карта вышла из строя.
# Какой из двух применять, решает джоба выкатки по переменной AI_BACKEND.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace задаётся здесь, а не в базе: сами объекты не должны знать, в каком контуре они живут.
# Namespace flow-ai создаёт слой платформы, модулю его создавать не надо.
namespace: flow-ai

resources:
  - ../../../base/ai

# Заявка на подмену образа. Строка выглядит бессмысленной (newTag повторяет тот, что уже в базе), но
# смысл у неё есть: джоба рендера выполняет `kustomize edit set image ghcr.io/ggml-org/llama.cpp@<digest>`
# именно над этим файлом, и объявленная секция сразу показывает, что подставляется и куда. В кластер
# уедет digest, а не тег: с подвижным тегом kubectl apply не увидит изменений при обновлении образа,
# и rollout просто не произойдёт.
#
# Тег server — это вариант образа под CPU. Он и CUDA-шный server-cuda лежат в ОДНОМ репозитории
# ghcr.io/ggml-org/llama.cpp, а трансформер images сопоставляет образы по имени без тега. Отсюда
# требование к CI: digest'ы резолвятся и подставляются по одному оверлею за раз, иначе CPU-профиль
# получил бы digest CUDA-образа без единой жалобы (см. scripts/resolve-images.py).
images:
  - name: ghcr.io/ggml-org/llama.cpp
    newTag: server
