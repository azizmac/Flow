# Слой хранилища объектов: MinIO и разовая джоба создания бакета. Перенос сервисов s3 и s3-init из
# docker-compose.data.yml — s3-init отдельным модулем не стал намеренно: создание бакета это часть выкатки
# хранилища, а не самостоятельная сущность, и жить оно должно ровно там же.
#
# Поля namespace здесь нет: его задаёт оверлей (k8s/overlays/home/s3). База namespace не знает специально —
# второй контур поднимается другим оверлеем, а не правкой базы.
#
# Ни Secret, ни ConfigMap слой не создаёт. flow-secrets (MINIO_ROOT_USER, MINIO_ROOT_PASSWORD) и flow-config
# (S3_ENDPOINT, S3_BUCKET) кладёт в namespace джоба deploy-platform из GitHub Secrets и Variables — в
# репозитории не коммитится ни одного секрета, а манифесты только ссылаются на готовые объекты.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml
  - job-create-bucket.yaml
