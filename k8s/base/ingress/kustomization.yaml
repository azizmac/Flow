# Слой приложения, модуль ingress: три объекта Ingress в одном файле.
#
# Почему модуль отдельный, а не по одному Ingress рядом с каждым Deployment. Внешние адреса — это
# ответственность кластера, а не сервиса: они появляются позже приложения, меняются вместе (переход на
# TLS трогает все три сразу, см. §10.1 ТЗ) и завязаны на ingress-контроллер, которого в compose нет вовсе.
# Отдельный модуль даёт отдельную строку в списке выкатки и возможность катить адреса, не трогая поды.
#
# Контейнеров в слое нет, поэтому у оверлея не будет и секции `images:`. `namespace:` задаёт оверлей.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
