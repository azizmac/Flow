# Конфиг hadolint для трёх Dockerfile: src/Flow.Api, src/Flow.Auth, src/Flow.Client.
# Джоба «Проверка · Dockerfile» гоняет линтер матрицей по файлам, а конфиг у всех трёх общий —
# поэтому каждое исключение здесь выключает правило сразу везде и каждое приходится объяснять.
#
# Порог падения намеренно не задан: по умолчанию hadolint валится начиная с уровня info, и это то,
# что нужно. Info-правила здесь не про стиль, а про вещи, которые ломают именно сборку образа.

ignored:
  # DL3066 «Non-numeric user-id may not be resolvable by host system» — единственная находка линтера
  # во всём репозитории (hadolint 2.15.1). Срабатывает на `USER $APP_UID` в src/Flow.Api/Dockerfile.
  # Находка ложная: APP_UID объявлен в базовом образе mcr.microsoft.com/dotnet/aspnet и содержит
  # числовой UID непривилегированного пользователя. Значений ARG и ENV базового образа hadolint не
  # видит, поэтому любое имя переменной считает нечисловым. Без этого исключения джоба падает на
  # исправном Dockerfile, а «поправить» его можно только зашив UID числом руками — это хуже:
  # число придётся синхронизировать с образом при каждом обновлении .NET.
  - DL3066

# DL3002 «Last USER should not be root» в списке намеренно отсутствует.
#
# ТЗ (docs/TZ_cicd_k8s.md, §4, стадия 0) предполагает, что правило сработает на src/Flow.Auth/Dockerfile:
# инструкции USER там нет, и это осознанно — сервис пишет сертификаты OpenIddict (/certs) и ключи
# Data Protection (/keys) в тома, созданные от root, а под non-root эти каталоги нужно сначала chown.
#
# Проверено запуском hadolint 2.15.1 по всем трём файлам: правило молчит, находок по Flow.Auth нет
# вообще ни одной. DL3002 смотрит только на инструкции USER в самом Dockerfile и о пользователе
# базового образа ничего не знает — там, где USER нет вовсе, срабатывать нечему.
#
# Глушить его «на всякий случай» вредно вдвойне: исключение общее для трёх файлов, и явный `USER root`,
# если он когда-нибудь появится в Api или Client, прошёл бы молча. Если правило всё же понадобится
# погасить точечно, для этого есть прагма в самом файле, строкой выше нужной инструкции:
#   # hadolint ignore=DL3002
