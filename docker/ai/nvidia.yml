# Профиль железа для локального стенда: видеокарта NVIDIA у сервиса ai.
#
# Отдельным файлом, а не вторым сервисом в docker-compose.data.yml. Причина простая: дубликат сервиса
# означает два описания одного и того же, которые расходятся на первой же правке аргументов или проб.
# Здесь переопределяются ровно две вещи — вариант образа и резервация карты, — а всё остальное
# наследуется из основного файла.
#
# Применение (порядок файлов важен, последний побеждает):
#   docker compose -f docker-compose.data.yml -f docker/ai/nvidia.yml --profile ai up -d
#
# Без этого файла сервис поднимается на процессоре, и это нормальный, а не аварийный режим: тот же
# образ, тот же пресет моделей, те же эндпоинты. Разница только в скорости.
#
# Аргумент --gpu-layers здесь не появляется намеренно: у llama.cpp значение по умолчанию auto, сервер
# сам раскладывает слои по устройствам, а на машине без карты печатает предупреждение и продолжает.
# То есть одна и та же команда корректна в обоих профилях, и одним отличием меньше.
#
# ВАЖНО: размеры буферов этот файл не трогает, но на карте их менять обязательно. Процессорные
# значения по умолчанию (8192) в видеопамять не влезают — на GTX 1650 SUPER (4 ГБ) сервер просит под
# вычислительный буфер 4932 МиБ и падает с «cudaMalloc failed: out of memory», не догрузив даже
# эмбеддер. Перед запуском профиля поставьте в .env измеренную на ней тройку:
#
#   AI_CTX_SIZE=2048
#   AI_BATCH_SIZE=512
#   AI_UBATCH_SIZE=512
#
# Почему через .env, а не вторым command здесь: команда сервиса — восемь строк, и второй её экземпляр
# разошёлся бы с основным на первой же правке. Это ровно та причина, по которой весь профиль живёт
# отдельным файлом, а не вторым сервисом. Забытая правка .env даёт громкий отказ на старте с явной
# строкой про cudaMalloc, а не тихую деградацию, — цена ошибки приемлемая.
#
# В кластере эта развилка автоматическая: те же три значения проставляет компонент
# k8s/components/gpu-nvidia, и помнить о них там не нужно.
services:
  ai:
    # Своя переменная, а не общая AI_IMAGE, и это не дублирование. AI_IMAGE задаёт образ базового
    # (процессорного) профиля; если бы она стояла и здесь, то человек, прибивший в .env AI_IMAGE
    # к CPU-сборке, получил бы самый неприятный из возможных исходов: карта зарезервирована,
    # а считает всё равно процессор — и ни одной жалобы ни от Docker, ни от llama.cpp.
    image: ${AI_IMAGE_CUDA:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
