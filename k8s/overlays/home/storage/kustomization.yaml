# Оверлей домашнего кластера, слой хранилища. Рендерится в manifests/storage.yaml и применяется ТОЛЬКО
# вручную: `workflow_dispatch` с module=storage. В общий прогон выкатки этот оверлей не входит.
#
# Единственное значение, зависящее от кластера, — StorageClass, и он записан плейсхолдером ${STORAGE_CLASS}
# прямо в базе: envsubst в джобе рендера подставит его до `kustomize build`. Патчить его из оверлея было бы
# хуже — пять почти одинаковых патчей вместо одной строки, и любой новый PVC пришлось бы не забыть внести
# в этот список.
#
# `namespace:` не задаётся: PVC живут в трёх разных namespace, каждый несёт свой в metadata.
# `images:` нет: в слое нет ни одного контейнера.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/storage
