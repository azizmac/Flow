; Какие модели отдаёт llama-server и с какими настройками. Один файл на два контура: его монтирует
; сервис ai из docker-compose.data.yml и он же уезжает в кластер ConfigMap'ом. В k8s/base/ai/models.ini
; лежит дословная копия — kustomize не умеет читать файлы выше своего корня, поэтому копия неизбежна,
; и её совпадение с этим файлом проверяет CI (ровно как у docker/data/backup.sh).
;
; Почему один сервер на три модели, а не три сервиса. llama-server с декабря 2025 умеет router-режим:
; запускается без --model, читает этот файл и сам поднимает каждую модель отдельным процессом, маршрутизируя
; запросы по полю "model" в теле. Отсюда три следствия, ради которых всё и затевалось:
;   * один под, один порт, один адрес в настройках приложения вместо двух сервисов;
;   * модель грузится по первому обращению, поэтому при RERANK_ENABLED=false реранкер не занимает
;     ни байта — память платится за то, что реально используется;
;   * визуальная модель живёт здесь же, третьей секцией с ключом mmproj, а не отдельным сервисом
;     на vLLM: на карте этого кластера (4 ГБ, Turing) vLLM не запускается в принципе — bf16 там нет,
;     а fp16-веса Qwen3-VL-Embedding-2B весят 4.26 ГБ. Проверено, что llama.cpp даёт то, ради чего
;     визуальная половина нужна: текст «красный квадрат» ближе к красному квадрату (0.641), чем
;     к синему (0.535) и зелёному (0.556);
;   * настройки режимов пер-модельные. Это не украшение: глобальный --reranking форсит pooling_type=4
;     и эмбеддер начинает молча отдавать нули (llama.cpp#21256, закрыт как not planned). Ни --embedding,
;     ни --reranking, ни --pooling не должны попадать в аргументы командной строки сервера — только сюда.
;
; Формат: секция = имя модели в запросе, ключи = длинные аргументы командной строки без дефисов.
;
; Два совпадения, которые этот файл обязан держать с остальным репозиторием, и оба проверяет
; scripts/check-ai-preset.py в CI — руками их не уследить:
;   * имя секции = EMBEDDINGS_MODEL / RERANKER_MODEL / VISION_MODEL из .env.example. Именно это значение .NET кладёт
;     в поле "model", и по нему роутер выбирает процесс; разойдутся — сервер ответит «модель не найдена»;
;   * путь в ключе model = /models/<файл> = EMBEDDINGS_MODEL_FILE / RERANKER_MODEL_FILE из .env.example.
;     То же у визуальной модели: VISION_MODEL_FILE и VISION_MMPROJ_FILE. Эти переменные больше
;     не доезжают до сервера (раньше их подставляли в --model), но по ним
;     качает веса docker/data/pull-models.sh и Job закачки в кластере. Разойдутся — сервер будет
;     искать файл, которого никто не скачал. Имя файла весов визуальной модели вдобавок входит
;     в её ModelVersion: сменили квантизацию — картинки переиндексируются сами.
version = 1

; Секции [*] здесь намеренно нет, и размеров буферов (ctx-size, batch-size, ubatch-size) тоже: и то,
; и другое зависит от машины, а файл общий у кластера и локального стенда. Всё машинозависимое приезжает
; аргументами командной строки роутера, и процессы моделей их наследуют — проверено, аргументы видны
; в /v1/models у каждой модели:
;   * --threads: в кластере из limits.cpu через Downward API (k8s/base/ai/ai.yaml), локально из AI_THREADS;
;   * --ctx-size / --batch-size / --ubatch-size: из профиля железа. На процессоре это 8192, на карте —
;     2048/512/512, и разница не косметическая. Замер на GTX 1650 SUPER (4 ГБ): при ubatch-size 8192
;     сервер просит 4932 МиБ только под вычислительный буфер и падает с «cudaMalloc failed: out of memory»,
;     не догрузив даже эмбеддер. В хостовой памяти те же 8192 проходили незаметно — потому файл и прожил
;     с ними до первой выкатки на карту.
;
; Почему аргументами безопасно для размеров и потоков и небезопасно для режимов: командная строка имеет
; высший приоритет и достаётся ВСЕМ моделям сразу. Для числа потоков и размеров буферов это ровно то,
; что нужно, — они и должны быть одинаковыми на одной машине. Для --embedding и --reranking это
; катастрофа: см. предупреждение ниже.

; Эмбеддер поиска. Грузится на старте, а не по требованию: он нужен каждому запросу, и заставлять
; первого пользователя после выкатки ждать загрузку весов незачем.
;
; --pooling last обязателен для Qwen3-Embedding: пулинг по последнему токену делает сам сервер.
; Урезание до 512 измерений (MRL) и повторную нормализацию делает .NET — см. Qwen3Embeddings.Reduce.
[Qwen3-Embedding-0.6B]
model = /models/Qwen3-Embedding-0.6B-Q8_0.gguf
embedding = true
pooling = last
load-on-startup = true

; Вторая ступень выдачи. load-on-startup не указан намеренно — значит грузится по первому запросу
; и только если реранк вообще включён (RERANK_ENABLED, кнопка «Точнее» в интерфейсе).
;
; Модель именно bge-reranker-v2-m3, а не Qwen3-Reranker из исходного ТЗ: последний — causal LM без
; классификационной головы, llama.cpp честно пишет «model default pooling_type is [-1]» и ранжирует
; мусором (проверено: правильный документ получал оценку на три порядка ниже постороннего).
; Режим reranking рассчитан на cross-encoder с головой, каким bge-reranker-v2-m3 и является.
;
; Про CPU. Записанный в проекте вердикт «на CPU прогон пар занимает десятки секунд» относился к другой
; модели и окну в 25 пар (~15 тыс. токенов). Фактически TopN=10 и MaxDocumentChars=1200 — это около
; 3-4 тыс. токенов, вчетверо меньше. Замера на CPU с этой моделью и этим окном по-прежнему не существует.
; Зато есть замер на карте: на GTX 1650 SUPER эта модель занимает всего 400 МиБ видеопамяти — её
; архитектура (XLM-RoBERTa) на карту почти не выгружается, так что реранк упирается в процессор
; в обоих профилях. Крутилки, если понадобятся, — ubatch-size и ctx-size, но уже не здесь, а в профиле
; железа: k8s/components/gpu-nvidia для карты, k8s/base/ai/ai.yaml и docker-compose.data.yml для процессора.
[bge-reranker-v2-m3]
model = /models/bge-reranker-v2-m3-Q8_0.gguf
reranking = true
pooling = rank

; Визуальная модель: та же половина поиска, только вход — картинка. load-on-startup не указан
; намеренно — грузится по первому обращению и только при VISION_ENABLED=true.
;
; mmproj — тот самый ключ, без которого всё остальное бессмысленно: это веса проектора, который
; превращает пиксели в токены. Без него сервер поднимет текстовую половину модели, в /props не будет
; ни media_marker, ни modalities.vision, и картинку принять будет нечем.
;
; Прежний вердикт «вектор красного квадрата совпадает с синим» проверял не llama.cpp, а форму запроса:
; тело уходило в виде vLLM (messages с image_url), сервер его на эндпоинте эмбеддингов не разбирает
; вовсе и эмбеддит текстовый остаток — отсюда и совпадение векторов. В собственном формате
; (prompt_string с маркером медиа плюс multimodal_data) картинка через проектор проходит.
;
; Квантизация Q4_K_M, а не Q8_0, и это выбор по замеру, а не по вкусу: на GTX 1650 SUPER (4 ГБ)
; Q4_K_M + проектор Q8_0 занимают столько, что рядом помещаются обе текстовые модели — все три
; держатся в карте одновременно (2824 МиБ из 3715) и не вытесняют друг друга посреди запроса.
; С Q8_0 (1.8 ГБ вместо 1.1) такого запаса уже нет. Картинка 1280x720 проходит за 5.9 с при
; таймауте визуальной индексации 30 с.
[Qwen3-VL-Embedding-2B]
model = /models/Qwen3-VL-Embedding-2B.Q4_K_M.gguf
mmproj = /models/Qwen3-VL-Embedding-2B.mmproj-Q8_0.gguf
embedding = true
pooling = last
