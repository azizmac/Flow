# Текстовая половина поиска: один llama-server в router-режиме отдаёт и эмбеддинги, и реранк.
# Источник — сервис ai профиля ai из docker-compose.data.yml.
#
# Почему один под вместо двух. До этого модуля было два Deployment'а — flow-embeddings на CPU-образе
# и flow-reranker на CUDA-образе, — и они делили один репозиторий образа, различаясь только тегом.
# Это стоило двух сервисов, двух адресов в настройках, двух наборов проб и отдельной оговорки в
# оверлеях о том, что сводить их вместе нельзя. Router-режим убирает всё перечисленное: модели
# описаны в models.ini, роутер сам поднимает процесс под каждую и маршрутизирует по полю "model".
#
# База — CPU. Не потому, что видеокарта не нужна, а потому, что kustomize-компоненты надёжно ДОБАВЛЯЮТ
# поля и плохо их УДАЛЯЮТ: выкинуть nvidia.com/gpu из базы можно только патчем JSON6902 с экранированным
# слешем в пути, и такая конструкция ломается молча. При CPU-базе «карты нет» перестаёт быть особым
# случаем и становится основным путём, а NVIDIA подключается компонентом k8s/components/gpu-nvidia.
#
# Главное про весь AI-слой, и здесь оно тоже действует: модуль не обязателен. Недоступность этого
# сервиса — деградация поиска (выдача строится по словам), а не сбой старта Flow.Api. Поэтому у api
# нет ни initContainer'а, ждущего /health, ни пробы, завязанной на модель.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-ai
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  # Recreate, а не RollingUpdate. При replicas: 1 катить «без простоя» всё равно не выйдет, а maxSurge
  # на время выкатки удваивает потребление памяти — на единственной worker-ноде, где рядом живут postgres
  # и MinIO, это самый дешёвый способ получить выселение соседей. Отдельно это обязательный режим для
  # профиля с картой: nvidia.com/gpu неделим, и новый под ждал бы вторую карту вечно.
  strategy:
    type: Recreate
  # Парный ограничитель к --timeout у rollout status (переменная AI_DEPLOY_TIMEOUT, дефолт 900). Оба
  # обязаны покрывать холодный старт с чтением весов с диска, иначе выкатка краснеет на исправном сервисе.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
      app.kubernetes.io/part-of: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/part-of: flow
        app.kubernetes.io/component: ai
    spec:
      # Secret regcred создаёт джоба deploy-platform, не kustomize. Для ghcr.io он бесполезен (в
      # .dockerconfigjson лежит запись только для docker.io), но оставлен осознанно: он ничего не ломает,
      # а в день переезда образов в приватный реестр менять придётся секрет, а не манифест.
      imagePullSecrets:
        - name: regcred
      # Под прибит к той же ноде, где физически лежит PVC flow-models: у local-path том — это каталог
      # на диске конкретной ноды. Компонент gpu-nvidia подменяет эту строку на GPU_NODE, и если узлы
      # разъедутся, второй потребитель тома встанет в Pending с Multi-Attach — диагноз будет выглядеть
      # как проблема планировщика, хотя причина в разъехавшихся переменных.
      nodeSelector:
        kubernetes.io/hostname: "${WORKER_NODE}"
      containers:
        - name: ai
          # Тег-заглушка: в кластер уезжает digest, который подставляет kustomize в оверлее. Тег server
          # у llama.cpp подвижный ровно так же, как latest, — просто без digest'а мы бы этого не заметили.
          # Компонент gpu-nvidia меняет тег на server-cuda.
          image: ghcr.io/ggml-org/llama.cpp:server
          imagePullPolicy: IfNotPresent
          # args, а не command: у образа свой ENTRYPOINT (/app/llama-server), а command в Kubernetes
          # перекрывает именно ENTRYPOINT.
          #
          # Здесь нет ни --model, ни --embedding, ни --reranking, ни --pooling — и это принципиально.
          # Отсутствие --model включает router-режим. А режимы обязаны оставаться пер-модельными в
          # models.ini: аргументы командной строки наследуются всеми процессами моделей и имеют высший
          # приоритет, поэтому глобальный --reranking форсит pooling_type=4, и эмбеддер начинает молча
          # отдавать нули (llama.cpp#21256, закрыт как not planned). Ошибка без единой записи в логе.
          args:
            - --models-preset
            - /config/models.ini
            # Ровно столько, сколько моделей в пресете: вытеснение по LRU нам не нужно — обе модели
            # маленькие, а своп означал бы секунды холодного старта посреди пользовательского запроса.
            # Значение придётся поднять, если в models.ini появится третья модель.
            - --models-max
            - "2"
            # Веб-интерфейс сервера на этом же порту нам не нужен: Service наружу не публикуется,
            # а лишняя поверхность не бесплатна.
            - --no-webui
            # Потоки. Без явного значения llama.cpp берёт их из hardware_concurrency, а оно показывает все
            # ядра ноды и ничего не знает про cgroup-квоту: на 32-ядерной машине с limits.cpu 4 это 32
            # потока, дерущихся за квоту четырёх.
            #
            # Значение НЕ переменная и не литерал, а сам limits.cpu, прочитанный через Downward API ниже.
            # Так инвариант «потоков ровно столько, сколько разрешено ядер» держит Kubernetes, а не
            # комментарий: поднял лимит — потоки поехали за ним, и разъехаться им негде. Отдельная
            # переменная здесь была бы третьим местом, где записано одно и то же число.
            #
            # Аргументом роутера, а не ключом в models.ini: процессы моделей наследуют командную строку
            # (проверено — аргумент виден в /v1/models у каждой модели), а пресет общий у кластера
            # и локального стенда, где число ядер другое.
            #
            # Сколько это стоит, померено на i9-14900KF (32 ядра, AVX2, без AVX512), чанки боевого
            # размера — 1536 символов, то есть ChunkTokens 512 × CharsPerToken 3:
            #   4 потока  — запрос поиска 39 мс, батч из 16 чанков 60.9 с;
            #   16 потоков — запрос 39 мс, батч из 16 чанков 33.2 с, из 8 чанков 16.1 с.
            # Верхняя строка — это ОТКАЗ, а не медленно: у клиента индексации таймаут 60 с прибит
            # в коде (FlowSearchServiceCollectionExtensions.cs:125), и батч в него не укладывается,
            # уходит в повторы и копит очередь. Отсюда правило: limits.cpu ниже четырёх ядер для этого
            # модуля не имеет смысла ставить вовсе, а на боевых объёмах текста нужно ближе к шестнадцати.
            - --threads
            - $(AI_THREADS)
            - --host
            - 0.0.0.0
            - --port
            - "8081"
          env:
            # Downward API, а не ConfigMap: значение берётся из limits.cpu ЭТОГО контейнера и округляется
            # вверх до целых ядер. Забыть его нельзя, разойтись с лимитом — тоже, и в GitHub Variables
            # заводить нечего. Прежний вариант с configMapKeyRef давал ровно то, за что его и убрали:
            # ключ, который легко не положить в ConfigMap, и под в CreateContainerConfigError на выкатке.
            - name: AI_THREADS
              valueFrom:
                resourceFieldRef:
                  containerName: ai
                  resource: limits.cpu
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          # Пробы стучатся по http силами kubelet, поэтому из compose исчезает и curl, и переопределение
          # healthcheck: там проверку выполнял сам контейнер (встроенный healthcheck ходил на 8080, хотя
          # сервер поднят на 8081, и контейнер вечно висел unhealthy при исправной модели).
          #
          # /health у llama-server отвечает 503 с «Loading model», пока веса грузятся, и 200 после.
          # Оговорка про router-режим: этот эндпоинт описывает сам роутер, и модель с load-on-startup
          # может ещё догружаться в момент первого 200. Для нас это не опасно — приложение в такой
          # момент деградирует до словесного поиска, а не падает, — но проверить фактическое поведение
          # на первой выкатке стоит: команда есть в §6 ТЗ.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            # 30 попыток по 10 с = 5 минут на холодный старт. В compose на это стоял start_period 60s,
            # но там веса лежали в томе на локальном SSD; здесь том — каталог на диске домашней ноды,
            # который в момент выкатки может быть занят postgres и MinIO. Пока startupProbe не прошла,
            # liveness не работает вовсе, поэтому щедрый бюджет не опаснее, чем более поздний диагноз.
            failureThreshold: 30
          # Readiness — единственная проба, которая НЕ смотрит на /health, и это не прихоть. В router-режиме
          # /health описывает роутер: он отвечает 200 сразу после старта, даже если модель с load-on-startup
          # не загрузилась или её процесс убили по памяти. Под остался бы Ready и молча отдавал ошибки,
          # а приложение деградировало бы до словесного поиска — симптом, который ищут в коде поиска,
          # а не в состоянии пода. Поэтому здесь спрашиваем список моделей и требуем хотя бы одну loaded:
          # ровно то, что делает сервис полезным. curl есть в образе (он же используется в healthcheck
          # compose), grep -q — тоже busybox-минимум.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:8081/v1/models | grep -q '"value":"loaded"'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            # Сознательно вялая: 6 промахов по 30 с — три минуты. Перезапуск из-за таймаута пробы под
            # нагрузкой обходится дороже самой недоступности, потому что это ещё и повторное чтение
            # весов с диска, то есть минуты вместо секунд.
            failureThreshold: 6
          resources:
            # Считалось так. Веса Q8_0: эмбеддер 0.64 ГиБ, реранкер 0.64 ГиБ. KV-кэш при ctx-size 8192 —
            # ещё порядка гигабайта на модель, главный едок — вычислительные буферы от ubatch-size.
            # Запрос 1.5Gi покрывает поднятый эмбеддер (он грузится на старте), потолок 6Gi — обе модели
            # разом, что случается только при включённом реранке: без него вторая модель не грузится
            # вовсе, потому что роутер поднимает модель по первому обращению к ней.
            # Потолок не «на всякий случай»: OOMKill этого пода — деградация поиска, а вот вытеснение
            # соседей по ноде из-за незакрытого лимита задело бы postgres, то есть весь продукт.
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              # Этот же лимит приезжает в --threads через Downward API выше — менять надо здесь и только
              # здесь. Значение подставляет джоба рендера из переменной AI_CPU_LIMIT: сколько ядер отдать
              # моделям, зависит от ноды, и вписывать это литералом в базу значит чинить его патчем
              # в каждом контуре. Нижняя граница не вкусовая: при четырёх ядрах батч индексации боевого
              # размера занял 60.9 с при таймауте клиента 60 с, то есть индексация не тормозит, а отказывает.
              cpu: "${AI_CPU_LIMIT}"
              # Замерено на обеих загруженных моделях после прогона индексации: 3.9 ГиБ. Потолок 6Gi —
              # это запас, а не пожелание: пики приходятся на вычислительные буферы от ubatch-size,
              # и они зависят от того, сколько текста прилетело одним батчем.
              memory: 6Gi
          securityContext:
            # runAsNonRoot здесь намеренно НЕ выставлен. В образе llama.cpp нет инструкции USER, то есть
            # он стартует root'ом; флаг без проверенного UID превращается не в защиту, а в
            # CreateContainerConfigError на старте («container has runAsNonRoot and image will run as root»).
            # Ставить его имеет смысл только вместе с runAsUser, а подобранный наугад UID должен ещё и
            # совпасть с правами на файлы в томе, которые создаёт Job закачки от root. Поэтому здесь
            # ровно то, что даёт выигрыш без гадания.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # readOnlyRootFilesystem не выставлен: роутер пишет во временные каталоги образа и в кэш
            # моделей. Это осознанный долг, а не недосмотр — единственное, что действительно ценно
            # в этом поде, это том с весами, и он примонтирован только на чтение.
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: presets
              mountPath: /config
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            # PVC объявлен в отдельном слое k8s/base/storage и применяется только вручную: удаление тома
            # уносит гигабайты скачанных весов, и привязывать их жизнь к жизни Deployment нельзя.
            claimName: flow-models
            # Только чтение, и это не формальность: сервис, который умеет писать в общий том, однажды
            # запишет туда что-нибудь при падении. Писать в этот том имеют право ровно двое — Job закачки
            # и vLLM, который качает свои веса сам.
            readOnly: true
        - name: presets
          configMap:
            # Имя без хэша: configMapGenerator в kustomization.yaml допишет к нему суффикс содержимого,
            # и ссылку здесь kustomize перепишет сам. Смысл суффикса в том, что правка models.ini меняет
            # имя ConfigMap, а значит и спеку пода — иначе выкатка нового пресета не перезапустила бы под,
            # и «я же поменял настройки» превратилось бы в час поисков.
            name: flow-ai-models
---
# Service назван так же, как Deployment. Отсюда адреса в настройках приложения:
#   EMBEDDINGS_QUERY_ENDPOINT = http://flow-ai.flow-ai.svc.cluster.local:8081/v1
#   RERANK_ENDPOINT           = http://flow-ai.flow-ai.svc.cluster.local:8081/v1
# Да, один и тот же — в этом и была цель: роутер различает модели по полю "model" в теле запроса,
# а .NET его и так шлёт (Search:Embeddings:Model и Search:Rerank:Model). Значения этих настроек обязаны
# совпадать с именами секций в models.ini, иначе роутер ответит ошибкой о неизвестной модели.
#
# Повтор flow-ai.flow-ai — не опечатка: первое имя сервиса, второе namespace.
apiVersion: v1
kind: Service
metadata:
  name: flow-ai
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: flow
  ports:
    - name: http
      port: 8081
      # По имени порта, а не по числу: номер живёт в одном месте — в контейнере.
      targetPort: http
      protocol: TCP
